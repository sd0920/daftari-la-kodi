<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

  #daftari-root {
    --bg: #EFEAE0;
    --bg-alt: #E4DCC6;
    --card: #FBF9F3;
    --ink: #1C2B26;
    --ink-soft: #55645D;
    --border: #D8CFB5;
    --gold: #A9822C;
    --gold-deep: #7C5F1F;
    --paid: #2F6B4F;
    --paid-bg: #E4EFE7;
    --partial: #A9822C;
    --partial-bg: #F5EDDA;
    --unpaid: #A8422F;
    --unpaid-bg: #F5E4DF;

    font-family: 'Work Sans', sans-serif;
    color: var(--ink);
    background: var(--bg);
    border-radius: 14px;
    padding: 0;
    max-width: 100%;
    box-sizing: border-box;
  }
  #daftari-root * { box-sizing: border-box; }

  .db-header {
    background: var(--ink);
    color: var(--bg);
    padding: 22px 24px 18px;
    border-radius: 14px 14px 0 0;
    position: relative;
    overflow: hidden;
  }
  .db-header::after {
    content: "";
    position: absolute;
    right: -30px; top: -30px;
    width: 140px; height: 140px;
    border: 2px solid rgba(233,213,150,0.18);
    border-radius: 50%;
  }
  .db-title {
    font-family: 'Lora', serif;
    font-weight: 700;
    font-size: 22px;
    margin: 0;
    letter-spacing: 0.2px;
  }
  .db-sub {
    font-size: 13px;
    color: #C9C2AE;
    margin-top: 4px;
  }

  .db-tabs {
    display: flex;
    gap: 2px;
    background: var(--bg-alt);
    padding: 6px;
    overflow-x: auto;
  }
  .db-tab {
    flex: 1;
    min-width: 90px;
    text-align: center;
    padding: 10px 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    font-family: 'Work Sans', sans-serif;
    white-space: nowrap;
  }
  .db-tab.active {
    background: var(--card);
    color: var(--gold-deep);
    box-shadow: 0 1px 3px rgba(28,43,38,0.12);
  }

  .db-body {
    padding: 18px 20px 24px;
    background: var(--bg);
  }

  .db-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px;
    margin-bottom: 18px;
  }
  .db-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .db-card-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 20px;
    font-weight: 600;
  }
  .db-card-label {
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .db-section-title {
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: 16px;
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .db-month-picker {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--card);
    color: var(--ink);
  }

  .db-table-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  table.db-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.db-table th {
    text-align: left;
    padding: 9px 12px;
    background: var(--bg-alt);
    color: var(--ink-soft);
    font-weight: 600;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  table.db-table td {
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    vertical-align: middle;
  }
  table.db-table tr:hover td { background: #F5F2E9; }

  .db-badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 20px;
    font-size: 11.5px;
    font-weight: 600;
  }
  .badge-paid { background: var(--paid-bg); color: var(--paid); }
  .badge-partial { background: var(--partial-bg); color: var(--partial); }
  .badge-unpaid { background: var(--unpaid-bg); color: var(--unpaid); }
  .badge-left { background: #E7E2D3; color: var(--ink-soft); }

  .db-btn {
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    padding: 7px 13px;
    border-radius: 7px;
    border: none;
    cursor: pointer;
    background: var(--ink);
    color: var(--bg);
    transition: opacity 0.15s;
  }
  .db-btn:hover { opacity: 0.85; }
  .db-btn.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink);
  }
  .db-btn.danger {
    background: transparent;
    color: var(--unpaid);
    border: 1px solid var(--unpaid-bg);
  }
  .db-btn.small { padding: 5px 10px; font-size: 11.5px; }

  .db-form {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 18px;
  }
  .db-form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin-bottom: 12px;
  }
  .db-field label {
    display: block;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .db-field input, .db-field select, .db-field textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 13px;
    font-family: 'Work Sans', sans-serif;
    background: #fff;
    color: var(--ink);
  }
  .db-field input:focus, .db-field select:focus, .db-field textarea:focus {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
  }

  .db-empty {
    text-align: center;
    padding: 30px 20px;
    color: var(--ink-soft);
    font-size: 13.5px;
  }

  .db-search {
    font-family: 'Work Sans', sans-serif;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--card);
    color: var(--ink);
    width: 100%;
    max-width: 280px;
  }
  .db-search:focus { outline: 2px solid var(--gold); outline-offset: 1px; }

  .db-mono { font-family: 'IBM Plex Mono', monospace; }
  .db-actions-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .db-toast {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--bg);
    padding: 9px 18px;
    border-radius: 20px;
    font-size: 13px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 100;
  }
  .db-toast.show { opacity: 1; }

  @media (max-width: 480px) {
    table.db-table { font-size: 12px; }
    table.db-table th, table.db-table td { padding: 7px 8px; }
  }
</style>

  function paidForMonth(tenantId, ym){
    return payments.filter(p=>p.tenantId===tenantId && p.forMonth===ym)
      .reduce((s,p)=>s+Number(p.amount||0),0);
  }
  function paidTotalFor(tenantId){
    return payments.filter(p=>p.tenantId===tenantId)
      .reduce((s,p)=>s+Number(p.amount||0),0);
  }
  function monthsElapsed(t){
    if(!t.moveInDate) return 0;
    const start = new Date(t.moveInDate + 'T00:00:00');
    const endStr = (t.status==='left' && t.moveOutDate) ? t.moveOutDate : new Date().toISOString().slice(0,10);
    const end = new Date(endStr + 'T00:00:00');
    let months = (end.getFullYear()-start.getFullYear())*12 + (end.getMonth()-start.getMonth()) + 1;
    return Math.max(months, 0);
  }
  // Inarudisha null kama kodi ya mwezi haijawekwa (hatuwezi kuhesabu deni)
  function totalOwed(t){
    const rent = Number(t.rentAmount||0);
    if(!rent) return null;
    const months = monthsElapsed(t);
    const expected = months * rent;
    const paid = paidTotalFor(t.id);
    return expected - paid;
  }

  function currentYM(t){
    const endStr = (t.status==='left' && t.moveOutDate) ? t.moveOutDate : new Date().toISOString().slice(0,10);
    return endStr.slice(0,7);
  }

  // Inagawanya deni: deni la mwezi huu peke yake, na deni la nyuma (miezi iliyopita)
  // Inarudisha null kama kodi haijawekwa
  function debtBreakdown(t){
    const rent = Number(t.rentAmount||0);
    if(!rent || !t.moveInDate) return null;
    const start = new Date(t.moveInDate + 'T00:00:00');
    const thisYM = currentYM(t);
    let y = start.getFullYear(), m = start.getMonth();
    const [endY, endM0] = thisYM.split('-').map(Number);
    const endM = endM0 - 1; // 0-indexed
    let arrears = 0;
    while(y < endY || (y===endY && m < endM)){
      const ym = `${y}-${String(m+1).padStart(2,'0')}`;
      const paid = paidForMonth(t.id, ym);
      arrears += (rent - paid);
      m++; if(m>11){ m=0; y++; }
    }
    const thisMonthPaid = paidForMonth(t.id, thisYM);
    const thisMonthDue = rent - thisMonthPaid;
    return { arrears, thisMonthDue, thisYM, total: arrears + thisMonthDue };
  }

  function oweBadgeHtml(t){
    const d = debtBreakdown(t);
    if(d===null) return '—';
    if(d.thisMonthDue<=0 && d.arrears<=0){
      return `<span class="db-badge badge-paid">Hana deni</span>`;
    }
    let html = d.thisMonthDue>0
      ? `<span class="db-badge badge-unpaid">${money(d.thisMonthDue)}</span>`
      : `<span class="db-badge badge-paid">Mwezi huu sawa</span>`;
    if(d.arrears>0){
      html += `<div style="font-size:11px;color:var(--unpaid);margin-top:3px;">+ deni la nyuma: ${money(d.arrears)}</div>`;
    }
    return html;
  }

  async function reconcileWithNewExcel(){
    let changed = 0;
    // Rekebisha majina ya vyumba vya Nyumba Mpya kutoka No.33-40 kwenda No.1-8
    const mpyaRenames = {"room_No33":"No. 1","room_No34":"No. 2","room_No35":"No. 3","room_No36":"No. 4","room_No37":"No. 5","room_No38":"No. 6","room_No39":"No. 7","room_No40":"No. 8"};
    Object.keys(mpyaRenames).forEach(rid=>{
      const r = rooms.find(x=>x.id===rid);
      if(r && r.name !== mpyaRenames[rid]){ r.name = mpyaRenames[rid]; changed++; }
    });

    Object.keys(CORRECTED_PAYMENTS_2026).forEach(tenantId=>{
      const t = tenants.find(x=>x.id===tenantId);
      if(!t) return;
      const monthMap = CORRECTED_PAYMENTS_2026[tenantId];
      for(let mm=1; mm<=12; mm++){
        const mmStr = String(mm).padStart(2,'0');
        const forMonth = `2026-${mmStr}`;
        const newAmt = monthMap[mmStr];
        const payId = `pay_${tenantId}_${mmStr}`;
        const existingIdx = payments.findIndex(p=>p.id===payId);
        if(newAmt){
          if(existingIdx>=0){
            if(Number(payments[existingIdx].amount)!==newAmt){
              payments[existingIdx].amount = String(newAmt);
              changed++;
            }
          } else {
            payments.push({id:payId, tenantId, roomId:t.roomId, date:`2026-${mmStr}-01`, forMonth, amount:String(newAmt), notes:''});
            changed++;
          }
        } else if(existingIdx>=0){
          payments.splice(existingIdx,1);
          changed++;
        }
      }
    });
    await saveRooms();
    await savePayments();
    toast(changed ? `Malipo yamesahihishwa: mabadiliko ${changed}` : 'Hakuna tofauti iliyopatikana');
  }

          <button class="db-btn" id="add-property">${editing ? 'Hifadhi mabadiliko' : 'Hifadhi nyumba'}</button>
          ${cancelEditPropHtml}
        </div>
      </div>
      <div class="db-section-title"><span>Orodha ya nyumba</span><input type="text" class="db-search" id="search-nyumba" placeholder="Tafuta nyumba..." value="${searchNyumba}"></div>
      <div class="db-table-wrap">
        ${nyumbaTableHtml}
      </div>
    `;

    bindSearchInput('search-nyumba', v=>{ searchNyumba=v; });
    bindEnterToClick(['property-name'], 'add-property');
    bindEnterToClick(['landlord-name','landlord-phone'], 'save-landlord');
    document.getElementById('save-landlord').addEventListener('click', async ()=>{
      landlordInfo = {
        name: document.getElementById('landlord-name').value.trim(),
        phone: document.getElementById('landlord-phone').value.trim()
      };
      await saveLandlordInfo();
      toast('Taarifa za mwenye nyumba zimehifadhiwa');
    });
    const importBtn = document.getElementById('import-excel');
    if(importBtn && !alreadyImported){
      importBtn.addEventListener('click', async ()=>{
        importBtn.disabled = true;
        importBtn.textContent = 'Inaingiza...';
        await importFromExcel();
        renderNyumba();
      });
    }
    const reconcileBtn = document.getElementById('reconcile-excel');
    if(reconcileBtn){
      reconcileBtn.addEventListener('click', async ()=>{
        reconcileBtn.disabled = true;
        reconcileBtn.textContent = 'Inasahihisha...';
        await reconcileWithNewExcel();
        renderNyumba();
      });
    }

    document.getElementById('add-property').addEventListener('click', async ()=>{
      const name = document.getElementById('property-name').value.trim();
      if(!name){ toast('Andika jina la nyumba'); return; }
      if(editing){
        editing.name = name;
        toast('Nyumba imesahihishwa');
      } else {
        properties.push({id: uid(), name});
        toast('Nyumba imeongezwa');
      }
      await saveProperties();
      editingPropertyId = null;
      renderNyumba();
    });
    const cancelEditPropBtn = document.getElementById('cancel-edit-property');
    if(cancelEditPropBtn) cancelEditPropBtn.addEventListener('click', ()=>{ editingPropertyId=null; renderNyumba(); });
    bodyEl.querySelectorAll('[data-edit-property]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ editingPropertyId = btn.dataset.editProperty; renderNyumba(); window.scrollTo(0,0); });
    });
    bodyEl.querySelectorAll('[data-del-property]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.dataset.delProperty;
        if(rooms.some(r=>r.propertyId===id)){
          toast('Nyumba hii ina vyumba, futa vyumba vyake kwanza');
          return;
        }
        properties = properties.filter(p=>p.id!==id);
        await saveProperties();
        renderNyumba();
      });
    });
  }

  // ---------- MUHTASARI ----------
  function renderMuhtasari(){
    const filtered = dashPropertyFilter
      ? activeTenants().filter(t=>propertyOfRoom(t.roomId)===dashPropertyFilter)
      : activeTenants();
    let totalPaidThisMonth = 0;
    let totalOwedAll = 0;
    let waliolipa = 0, hawajalipa = 0, sehemu = 0, wenyeDeni = 0;

    const rows = filtered.map(t=>{
      const paid = paidForMonth(t.id, dashMonth);
      const expected = Number(t.rentAmount||0);
      const d = debtBreakdown(t);
      totalPaidThisMonth += paid;
      if(d && d.total>0){ totalOwedAll += d.total; wenyeDeni++; }
      let statusHtml;
      if(expected > 0 && paid >= expected){ statusHtml = `<span class="db-badge badge-paid">Amelipa kamili</span>`; waliolipa++; }
      else if(paid > 0){ statusHtml = `<span class="db-badge badge-partial">Amelipa kiasi</span>`; sehemu++; }
      else { statusHtml = `<span class="db-badge badge-unpaid">Hajalipa</span>`; hawajalipa++; }
      const oweHtml = oweBadgeHtml(t);
      const kumbushaHtml = (d && d.total>0 && t.phone)
        ? ('<a class="db-btn small" style="background:#2F6B4F;text-decoration:none;display:inline-block;" href="https://wa.me/'+toIntlPhone(t.phone)+'?text='+encodeURIComponent(buildStatementForTenant(t))+'" target="_blank">Kumbusha (WhatsApp)</a>')
        : '';
      return `<tr>
        <td><a href="#" data-view-tenant="${t.id}" style="color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--border);cursor:pointer;">${t.name}</a></td>
        <td>${propertyName(propertyOfRoom(t.roomId))}</td>
        <td>${roomName(t.roomId)}</td>
        <td class="db-mono">${t.phone||'—'}</td>
        <td class="db-mono">${expected?money(expected):'—'}</td>
        <td class="db-mono">${money(paid)}</td>
        <td>${statusHtml}</td>
        <td>${oweHtml}</td>
        <td>
          <div class="db-actions-row">
            <button class="db-btn small" data-record="${t.id}">Rekodi malipo</button>
            ${kumbushaHtml}
          </div>
        </td>
      </tr>`;
    }).join('');

    const propFilterOptions = properties.map(p=>`<option value="${p.id}" ${dashPropertyFilter===p.id?'selected':''}>${p.name}</option>`).join('');
    const propSelectHtml = properties.length
      ? ('<select class="db-month-picker" id="dash-property"><option value="">Nyumba zote</option>'+propFilterOptions+'</select>')
      : '';
    const muhtasariTableHtml = filtered.length
      ? ('<table class="db-table"><thead><tr><th>Mpangaji</th><th>Nyumba</th><th>Chumba</th><th>Simu</th><th>Kodi</th><th>Amelipa mwezi huu</th><th>Hali</th><th>Deni</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>')
      : '<div class="db-empty">Hakuna mpangaji anayeishi kwa sasa. Nenda kwenye tab ya "Wapangaji" kuongeza.</div>';

    bodyEl.innerHTML = `
      <div class="db-section-title">
        <span>Muhtasari wa mwezi</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          ${propSelectHtml}
          <input type="month" class="db-month-picker" id="dash-month" value="${dashMonth}">
        </div>
      </div>
      <div class="db-cards">
        <div class="db-card"><div class="db-card-num">${filtered.length}</div><div class="db-card-label">Wapangaji wanaoishi</div></div>
        <div class="db-card"><div class="db-card-num" style="color:var(--paid)">${waliolipa}</div><div class="db-card-label">Wamelipa kamili</div></div>
        <div class="db-card"><div class="db-card-num" style="color:var(--partial)">${sehemu}</div><div class="db-card-label">Wamelipa kiasi</div></div>
        <div class="db-card"><div class="db-card-num" style="color:var(--unpaid)">${hawajalipa}</div><div class="db-card-label">Hawajalipa mwezi huu</div></div>
        <div class="db-card"><div class="db-card-num">${money(totalPaidThisMonth)}</div><div class="db-card-label">Imepokelewa (${fmtMonth(dashMonth)})</div></div>
        <div class="db-card"><div class="db-card-num" style="color:var(--unpaid)">${money(totalOwedAll)}</div><div class="db-card-label">Deni la jumla (${wenyeDeni} wenye deni)</div></div>
      </div>
      <div class="db-table-wrap">
        ${muhtasariTableHtml}
      </div>
    `;

    document.getElementById('dash-month').addEventListener('change', e=>{
      dashMonth = e.target.value;
      renderMuhtasari();
    });
    const propSel = document.getElementById('dash-property');
    if(propSel){
      propSel.addEventListener('change', e=>{
        dashPropertyFilter = e.target.value;
        renderMuhtasari();
      });
    }
    bodyEl.querySelectorAll('[data-record]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        activeTab='malipo';
        render();
        setTimeout(()=>{
          const sel = document.getElementById('pay-tenant');
          if(sel){ sel.value = btn.dataset.record; }
          const monthInput = document.getElementById('pay-month');
          if(monthInput){ monthInput.value = dashMonth; }
        }, 0);
      });
    });
    bodyEl.querySelectorAll('[data-view-tenant]').forEach(a=>{
      a.addEventListener('click', (e)=>{
        e.preventDefault();
        selectedTenantId = a.dataset.viewTenant;
        activeTab = 'tenantDetail';
        render();
        window.scrollTo(0,0);
      });
    });
  }

  // ---------- VYUMBA ----------
  function renderVyumba(){
    if(!properties.length){
      bodyEl.innerHTML = `<div class="db-empty">Kwanza ongeza nyumba kwenye tab ya "Nyumba" kabla ya kuongeza vyumba.</div>`;
      return;
    }
    const propOptions = properties.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');

    const sortedRooms = rooms.slice().sort((a,b)=>{
      const pa = propertyName(a.propertyId), pb = propertyName(b.propertyId);
      return pa.localeCompare(pb) || a.name.localeCompare(b.name);
    });
    const filteredRooms = searchVyumba
      ? sortedRooms.filter(r=>{
          const q = searchVyumba.toLowerCase();
          return r.name.toLowerCase().includes(q) || propertyName(r.propertyId).toLowerCase().includes(q);
        })
      : sortedRooms;
    const rows = filteredRooms.map(r=>{
      const occ = tenants.find(t=>t.roomId===r.id && t.status==='active');
      return `<tr>
        <td>${propertyName(r.propertyId)}</td>
        <td>${r.name}</td>
        <td>${occ ? occ.name : '<span class="db-badge badge-left">Wazi</span>'}</td>
        <td><button class="db-btn danger small" data-del-room="${r.id}">Futa</button></td>
      </tr>`;
    }).join('');

    const vyumbaTableHtml = filteredRooms.length
      ? ('<table class="db-table"><thead><tr><th>Nyumba</th><th>Chumba</th><th>Anayeishi sasa</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>')
      : ('<div class="db-empty">'+(searchVyumba ? 'Hakuna chumba kilichopatikana.' : 'Bado hujaongeza vyumba.')+'</div>');

    bodyEl.innerHTML = `
      <div class="db-form">
        <div class="db-section-title">Ongeza chumba</div>
        <div class="db-form-grid">
          <div class="db-field"><label>Nyumba</label><select id="room-property"><option value="">-- Chagua --</option>${propOptions}</select></div>
          <div class="db-field"><label>Jina/namba ya chumba</label><input id="room-name" placeholder="mfano: No. 3"></div>
        </div>
        <button class="db-btn" id="add-room">Hifadhi chumba</button>
      </div>
      <div class="db-section-title"><span>Orodha ya vyumba</span><input type="text" class="db-search" id="search-vyumba" placeholder="Tafuta chumba au nyumba..." value="${searchVyumba}"></div>
      <div class="db-table-wrap">
        ${vyumbaTableHtml}
      </div>
    `;

    bindSearchInput('search-vyumba', v=>{ searchVyumba=v; });
    bindEnterToClick(['room-name'], 'add-room');
    document.getElementById('add-room').addEventListener('click', async ()=>{
      const propertyId = document.getElementById('room-property').value;
      const name = document.getElementById('room-name').value.trim();
      if(!propertyId){ toast('Chagua nyumba'); return; }
      if(!name){ toast('Andika jina la chumba'); return; }
      rooms.push({id: uid(), name, propertyId});
      await saveRooms();
      toast('Chumba kimeongezwa');
      renderVyumba();
    });
    bodyEl.querySelectorAll('[data-del-room]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.dataset.delRoom;
        if(tenants.some(t=>t.roomId===id && t.status==='active')){
          toast('Chumba kina mpangaji, huwezi kukifuta');
          return;
        }
        rooms = rooms.filter(r=>r.id!==id);
        await saveRooms();
        renderVyumba();
      });
    });
  }

  // ---------- WAPANGAJI ----------
  function renderWapangaji(){
    const editing = editingTenantId ? tenants.find(t=>t.id===editingTenantId) : null;

    const roomOptionsHtml = properties.length
      ? properties.map(p=>{
          const opts = rooms.filter(r=>r.propertyId===p.id).map(r=>`<option value="${r.id}">${r.name}</option>`).join('');
          return opts ? `<optgroup label="${p.name}">${opts}</optgroup>` : '';
        }).join('')
      : rooms.map(r=>`<option value="${r.id}">${r.name}</option>`).join('');

    const sortedTenants = tenants.slice().sort((a,b)=> (b.moveInDate||'').localeCompare(a.moveInDate||''));
    const filteredTenants = searchWapangaji
      ? sortedTenants.filter(t=>{
          const q = searchWapangaji.toLowerCase();
          return t.name.toLowerCase().includes(q)
            || (t.phone||'').toLowerCase().includes(q)
            || roomName(t.roomId).toLowerCase().includes(q)
            || propertyName(propertyOfRoom(t.roomId)).toLowerCase().includes(q);
        })
      : sortedTenants;
    const rows = filteredTenants.map(t=>{
      const statusBadge = t.status==='active'
        ? `<span class="db-badge badge-paid">Anaishi</span>`
        : `<span class="db-badge badge-left">Ametoka</span>`;
      const owed = totalOwed(t);
      const oweHtml = oweBadgeHtml(t);
      const checkoutBtnHtml = t.status==='active' ? ('<button class="db-btn small" data-checkout="'+t.id+'">Ametoka</button>') : '';
      return `<tr>
        <td><a href="#" data-view-tenant="${t.id}" style="color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--border);cursor:pointer;">${t.name}</a></td>
        <td class="db-mono">${t.phone||'—'}</td>
        <td>${propertyName(propertyOfRoom(t.roomId))}</td>
        <td>${roomName(t.roomId)}</td>
        <td class="db-mono">${fmtDate(t.moveInDate)}</td>
        <td class="db-mono">${t.status==='active' ? '—' : fmtDate(t.moveOutDate)}</td>
        <td>${statusBadge}</td>
        <td>${oweHtml}</td>
        <td>
          <div class="db-actions-row">
            <button class="db-btn secondary small" data-edit-tenant="${t.id}">Hariri</button>
            ${checkoutBtnHtml}
          </div>
        </td>
      </tr>`;
    }).join('');

    const cancelEditTenantHtml = editing ? '<button class="db-btn secondary" id="cancel-edit">Ghairi</button>' : '';
    const wapangajiTableHtml = filteredTenants.length
      ? ('<table class="db-table"><thead><tr><th>Jina</th><th>Simu</th><th>Nyumba</th><th>Chumba</th><th>Aliingia</th><th>Alitoka</th><th>Hali</th><th>Deni</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>')
      : ('<div class="db-empty">'+(searchWapangaji ? 'Hakuna mpangaji aliyepatikana.' : 'Bado hujaongeza mpangaji yeyote.')+'</div>');

    bodyEl.innerHTML = `
      <div class="db-form">
        <div class="db-section-title">${editing ? 'Hariri mpangaji' : 'Ongeza mpangaji mpya'}</div>
        <div class="db-form-grid">
          <div class="db-field"><label>Jina</label><input id="t-name" value="${editing?editing.name:''}" placeholder="Jina kamili"></div>
          <div class="db-field"><label>Namba ya simu</label><input id="t-phone" value="${editing?(editing.phone||''):''}" placeholder="07XXXXXXXX"></div>
          <div class="db-field"><label>Chumba</label><select id="t-room"><option value="">-- Chagua --</option>${roomOptionsHtml}</select></div>
          <div class="db-field"><label>Kodi ya mwezi (si lazima)</label><input id="t-rent" type="number" value="${editing?(editing.rentAmount||''):''}" placeholder="mfano: 150000"></div>
          <div class="db-field"><label>Tarehe ya kuingia</label><input id="t-movein" type="date" value="${editing?(editing.moveInDate||''):''}"></div>
          <div class="db-field"><label>Maelezo ya ziada</label><input id="t-notes" value="${editing?(editing.notes||''):''}" placeholder="mfano: kazi, mawasiliano ya jamaa"></div>
        </div>
        <div class="db-actions-row">
          <button class="db-btn" id="save-tenant">${editing ? 'Hifadhi mabadiliko' : 'Ongeza mpangaji'}</button>
          ${cancelEditTenantHtml}
        </div>
      </div>
      <div class="db-section-title"><span>Orodha ya wapangaji</span><input type="text" class="db-search" id="search-wapangaji" placeholder="Tafuta jina, simu, chumba..." value="${searchWapangaji}"></div>
      <div class="db-table-wrap">
        ${wapangajiTableHtml}
      </div>
    `;

    if(editing){ document.getElementById('t-room').value = editing.roomId || ''; }
    bindSearchInput('search-wapangaji', v=>{ searchWapangaji=v; });
    bindEnterToClick(['t-name','t-phone','t-rent','t-movein','t-notes'], 'save-tenant');

    document.getElementById('save-tenant').addEventListener('click', async ()=>{
      const name = document.getElementById('t-name').value.trim();
      const phone = document.getElementById('t-phone').value.trim();
      const roomId = document.getElementById('t-room').value;
      const rentAmount = document.getElementById('t-rent').value;
      const moveInDate = document.getElementById('t-movein').value;
      const notes = document.getElementById('t-notes').value.trim();
      if(!name){ toast('Andika jina la mpangaji'); return; }
      if(!roomId){ toast('Chagua chumba'); return; }

      if(editing){
        Object.assign(editing, {name, phone, roomId, rentAmount, moveInDate, notes});
      } else {
        tenants.push({
          id: uid(), name, phone, roomId, rentAmount, moveInDate,
          notes, status:'active', moveOutDate:''
        });
      }
      await saveTenants();
      editingTenantId = null;
      toast('Taarifa za mpangaji zimehifadhiwa');
      renderWapangaji();
    });

    const cancelBtn = document.getElementById('cancel-edit');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ editingTenantId=null; renderWapangaji(); });

    bodyEl.querySelectorAll('[data-edit-tenant]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ editingTenantId = btn.dataset.editTenant; renderWapangaji(); window.scrollTo(0,0); });
    });
    bodyEl.querySelectorAll('[data-checkout]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const t = tenants.find(x=>x.id===btn.dataset.checkout);
        const date = prompt('Tarehe ya kutoka (YYYY-MM-DD):', new Date().toISOString().slice(0,10));
        if(date===null) return;
        t.status='left';
        t.moveOutDate = date;
        await saveTenants();
        toast('Mpangaji ameondolewa kwenye orodha ya wanaoishi');
        renderWapangaji();
      });
    });
    bodyEl.querySelectorAll('[data-view-tenant]').forEach(a=>{
      a.addEventListener('click', (e)=>{
        e.preventDefault();
        selectedTenantId = a.dataset.viewTenant;
        activeTab = 'tenantDetail';
        render();
        window.scrollTo(0,0);
      });
    });
  }

  // ---------- TAARIFA BINAFSI YA MPANGAJI ----------
  function renderTenantDetail(){
    const t = tenants.find(x=>x.id===selectedTenantId);
    if(!t){
      bodyEl.innerHTML = `<div class="db-empty">Mpangaji hajapatikana.</div>`;
      return;
    }
    const rent = Number(t.rentAmount||0);
    const paid = paidTotalFor(t.id);
    const d = debtBreakdown(t);
    const months = monthsElapsed(t);
    const history = payments.filter(p=>p.tenantId===t.id).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));

    const statementText = buildStatementForTenant(t);
    const waLink = t.phone ? ('https://wa.me/'+toIntlPhone(t.phone)+'?text='+encodeURIComponent(statementText)) : '';
    const smsLink = t.phone ? ('sms:'+t.phone+'?&body='+encodeURIComponent(statementText)) : '';
    const waBtnHtml = t.phone ? ('<a class="db-btn" style="background:#2F6B4F;text-decoration:none;display:inline-block;" href="'+waLink+'" target="_blank">Tuma WhatsApp</a>') : '';
    const smsBtnHtml = t.phone ? ('<a class="db-btn secondary" style="text-decoration:none;display:inline-block;" href="'+smsLink+'">Tuma SMS</a>') : '';
    const noPhoneNoteHtml = !t.phone ? '<span style="font-size:12px;color:var(--ink-soft);align-self:center;">Ongeza namba ya simu ya mpangaji ili kutuma moja kwa moja</span>' : '';

    const histRowsHtml2 = history.map(p=>{
      const waReceiptBtn = t.phone ? ('<a class="db-btn small" style="background:#2F6B4F;text-decoration:none;display:inline-block;" href="'+waLinkForReceipt(p)+'" target="_blank">WhatsApp</a>') : '';
      return '<tr><td class="db-mono">'+fmtDate(p.date)+'</td><td>'+fmtMonth(p.forMonth)+'</td><td class="db-mono">'+money(p.amount)+'</td><td>'+(p.notes||'—')+'</td><td><div class="db-actions-row"><button class="db-btn secondary small" data-print-receipt="'+p.id+'">Risiti</button>'+waReceiptBtn+'</div></td></tr>';
    }).join('');
    const histTableHtml2 = history.length
      ? ('<table class="db-table"><thead><tr><th>Tarehe</th><th>Mwezi aliolipia</th><th>Kiasi</th><th>Maelezo</th><th></th></tr></thead><tbody>'+histRowsHtml2+'</tbody></table>')
      : '<div class="db-empty">Bado hakuna malipo yaliyorekodiwa kwa mpangaji huyu.</div>';

    bodyEl.innerHTML = `
      <button class="db-btn secondary small" id="back-to-list" style="margin-bottom:14px;">&larr; Rudi kwenye orodha</button>
      <div class="db-section-title">${t.name}</div>
      <div class="db-cards">
        <div class="db-card"><div class="db-card-num">${propertyName(propertyOfRoom(t.roomId))}</div><div class="db-card-label">Nyumba</div></div>
        <div class="db-card"><div class="db-card-num">${roomName(t.roomId)}</div><div class="db-card-label">Chumba</div></div>
        <div class="db-card"><div class="db-card-num">${rent?money(rent):'—'}</div><div class="db-card-label">Kodi ya mwezi</div></div>
        <div class="db-card"><div class="db-card-num">${months}</div><div class="db-card-label">Miezi tangu aingie</div></div>
        <div class="db-card"><div class="db-card-num" style="color:var(--paid)">${money(paid)}</div><div class="db-card-label">Jumla amelipa</div></div>
        <div class="db-card"><div class="db-card-num" style="color:${d&&d.thisMonthDue>0?'var(--unpaid)':'var(--paid)'}">${d?(d.thisMonthDue>0?money(d.thisMonthDue):'0'):'—'}</div><div class="db-card-label">Deni la mwezi huu</div></div>
        <div class="db-card"><div class="db-card-num" style="color:${d&&d.arrears>0?'var(--unpaid)':'var(--paid)'}">${d?(d.arrears>0?money(d.arrears):'0'):'—'}</div><div class="db-card-label">Deni la nyuma</div></div>
      </div>

      <div class="db-form">
        <div class="db-section-title">Ankara ya kutuma kwa mpangaji</div>
        <textarea id="statement-text" readonly rows="9" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:7px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;background:#fff;">${statementText}</textarea>
        <div class="db-actions-row" style="margin-top:10px;">
          ${waBtnHtml}
          ${smsBtnHtml}
          <button class="db-btn secondary" id="copy-statement">Nakili maandishi</button>
          ${noPhoneNoteHtml}
        </div>
      </div>

      <div class="db-table-wrap">
        ${histTableHtml2}
      </div>
    `;

    document.getElementById('back-to-list').addEventListener('click', ()=>{
      activeTab = 'wapangaji';
      render();
    });
    bodyEl.querySelectorAll('[data-print-receipt]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ printReceipt(btn.dataset.printReceipt); });
    });
    document.getElementById('copy-statement').addEventListener('click', async ()=>{
      const ta = document.getElementById('statement-text');
      try{
        await navigator.clipboard.writeText(ta.value);
        toast('Maandishi yamenakiliwa');
      }catch(e){
        ta.select();
        try{ document.execCommand('copy'); toast('Maandishi yamenakiliwa'); }
        catch(e2){ toast('Chagua maandishi na unakili wewe mwenyewe'); }
      }
    });
  }

  // ---------- MALIPO ----------
  function renderMalipo(){
    const tenantOptions = tenants.map(t=>`<option value="${t.id}">${t.name} — ${propertyName(propertyOfRoom(t.roomId))} / ${roomName(t.roomId)}</option>`).join('');

    const sorted = payments.slice().sort((a,b)=> (b.date||'').localeCompare(a.date||''));
    const filteredPayments = searchMalipo
      ? sorted.filter(p=>{
          const q = searchMalipo.toLowerCase();
          return tenantName(p.tenantId).toLowerCase().includes(q)
            || propertyName(propertyOfRoom(p.roomId)).toLowerCase().includes(q)
            || roomName(p.roomId).toLowerCase().includes(q)
            || fmtMonth(p.forMonth).toLowerCase().includes(q)
            || (p.notes||'').toLowerCase().includes(q);
        })
      : sorted;
    const rows = filteredPayments.map(p=>{
      const hasPhone = tenants.find(x=>x.id===p.tenantId && x.phone);
      const waBtn = hasPhone ? ('<a class="db-btn small" style="background:#2F6B4F;text-decoration:none;display:inline-block;" href="'+waLinkForReceipt(p)+'" target="_blank">WhatsApp</a>') : '';
      return '<tr><td class="db-mono">'+fmtDate(p.date)+'</td><td>'+tenantName(p.tenantId)+'</td><td>'+propertyName(propertyOfRoom(p.roomId))+'</td><td>'+roomName(p.roomId)+'</td><td>'+fmtMonth(p.forMonth)+'</td><td class="db-mono">'+money(p.amount)+'</td><td>'+(p.notes||'—')+'</td><td><div class="db-actions-row"><button class="db-btn secondary small" data-print-receipt="'+p.id+'">Risiti</button>'+waBtn+'<button class="db-btn danger small" data-del-payment="'+p.id+'">Futa</button></div></td></tr>';
    }).join('');

    const malipoTableHtml = filteredPayments.length
      ? ('<table class="db-table"><thead><tr><th>Tarehe</th><th>Mpangaji</th><th>Nyumba</th><th>Chumba</th><th>Mwezi</th><th>Kiasi</th><th>Maelezo</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>')
      : ('<div class="db-empty">'+(searchMalipo ? 'Hakuna malipo yaliyopatikana.' : 'Bado hakuna malipo yaliyorekodiwa.')+'</div>');

    bodyEl.innerHTML = `
      <div class="db-form">
        <div class="db-section-title">Rekodi malipo</div>
        <div class="db-form-grid">
          <div class="db-field"><label>Mpangaji</label><select id="pay-tenant"><option value="">-- Chagua --</option>${tenantOptions}</select></div>
          <div class="db-field"><label>Tarehe ya malipo</label><input id="pay-date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
          <div class="db-field"><label>Analipia mwezi gani</label><input id="pay-month" type="month" value="${new Date().toISOString().slice(0,7)}"></div>
          <div class="db-field"><label>Kiasi</label><input id="pay-amount" type="number" placeholder="mfano: 150000"></div>
          <div class="db-field"><label>Maelezo (si lazima)</label><input id="pay-notes" placeholder="mfano: malipo ya nusu"></div>
        </div>
        <button class="db-btn" id="save-payment">Hifadhi malipo</button>
      </div>
      <div class="db-section-title"><span>Historia ya malipo</span><input type="text" class="db-search" id="search-malipo" placeholder="Tafuta mpangaji, chumba, mwezi..." value="${searchMalipo}"></div>
      <div class="db-table-wrap">
        ${malipoTableHtml}
      </div>
    `;

    bindSearchInput('search-malipo', v=>{ searchMalipo=v; });
    bindEnterToClick(['pay-date','pay-month','pay-amount','pay-notes'], 'save-payment');

    document.getElementById('save-payment').addEventListener('click', async ()=>{
      const tenantId = document.getElementById('pay-tenant').value;
      const date = document.getElementById('pay-date').value;
      const forMonth = document.getElementById('pay-month').value;
      const amount = document.getElementById('pay-amount').value;
      const notes = document.getElementById('pay-notes').value.trim();
      if(!tenantId){ toast('Chagua mpangaji'); return; }
      if(!date || !forMonth){ toast('Jaza tarehe na mwezi'); return; }
      if(!amount || Number(amount)<=0){ toast('Andika kiasi sahihi'); return; }
      const t = tenants.find(x=>x.id===tenantId);
      payments.push({id: uid(), tenantId, roomId: t.roomId, date, forMonth, amount, notes});
      await savePayments();
      toast('Malipo yamehifadhiwa');
      renderMalipo();
    });

    bodyEl.querySelectorAll('[data-print-receipt]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ printReceipt(btn.dataset.printReceipt); });
    });
    bodyEl.querySelectorAll('[data-del-payment]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        payments = payments.filter(p=>p.id!==btn.dataset.delPayment);
        await savePayments();
        renderMalipo();
      });
    });
  }

  // init
  (async ()=>{
    bodyEl.innerHTML = `<div class="db-empty">Inapakia...</div>`;
    await loadAll();
    render();
  })();
})();
</script>
