<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftari la Kodi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');


  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  #daftari-root {
    --bg: #EFEAE0;
    --bg-alt: #E4DCC6;
    --card: #FBF9F3;
    --ink: #1C2B26;
    --ink-soft: #55645D;
    --border: #D8CFB5;
    --gold: #A9822C;
    --gold-deep: #7C5F1F;
    --paid: #2F6B4F;
    --paid-bg: #E4EFE7;
    --partial: #A9822C;
    --partial-bg: #F5EDDA;
    --unpaid: #A8422F;
    --unpaid-bg: #F5E4DF;

    font-family: 'Work Sans', sans-serif;
    color: var(--ink);
    background: var(--bg);
    border-radius: 0;
    padding: 0;
    width: 100%;
    max-width: 100%;
    min-height: 100vh;
    box-sizing: border-box;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  #daftari-root * { box-sizing: border-box; }

  .db-header {
    background: var(--ink);
    color: var(--bg);
    padding: 22px 24px 18px;
    border-radius: 0;
    position: relative;
    overflow: hidden;
  }
  .db-header::after {
    content: "";
    position: absolute;
    right: -30px; top: -30px;
    width: 140px; height: 140px;
    border: 2px solid rgba(233,213,150,0.18);
    border-radius: 50%;
  }
  .db-title {
    font-family: 'Lora', serif;
    font-weight: 700;
    font-size: 22px;
    margin: 0;
    letter-spacing: 0.2px;
  }
  .db-sub {
    font-size: 13px;
    color: #C9C2AE;
    margin-top: 4px;
  }

  .db-tabs {
    display: flex;
    gap: 2px;
    background: var(--bg-alt);
    padding: 6px;
    overflow-x: auto;
  }
  .db-tab {
    flex: 1;
    min-width: 90px;
    text-align: center;
    padding: 10px 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    font-family: 'Work Sans', sans-serif;
    white-space: nowrap;
  }
  .db-tab.active {
    background: var(--card);
    color: var(--gold-deep);
    box-shadow: 0 1px 3px rgba(28,43,38,0.12);
  }

  .db-body {
    padding: 18px 20px 24px;
    background: var(--bg);
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
  }

  .db-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px;
    margin-bottom: 18px;
  }
  .db-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .db-card-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 20px;
    font-weight: 600;
  }
  .db-card-label {
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .db-section-title {
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: 16px;
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .db-month-picker {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--card);
    color: var(--ink);
  }

  .db-table-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  table.db-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.db-table th {
    text-align: left;
    padding: 9px 12px;
    background: var(--bg-alt);
    color: var(--ink-soft);
    font-weight: 600;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  table.db-table td {
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    vertical-align: middle;
  }
  table.db-table tr:hover td { background: #F5F2E9; }

  .db-badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 20px;
    font-size: 11.5px;
    font-weight: 600;
  }
  .badge-paid { background: var(--paid-bg); color: var(--paid); }
  .badge-partial { background: var(--partial-bg); color: var(--partial); }
  .badge-unpaid { background: var(--unpaid-bg); color: var(--unpaid); }
  .badge-left { background: #E7E2D3; color: var(--ink-soft); }

  .db-btn {
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    padding: 7px 13px;
    border-radius: 7px;
    border: none;
    cursor: pointer;
    background: var(--ink);
    color: var(--bg);
    transition: opacity 0.15s;
  }
  .db-btn:hover { opacity: 0.85; }
  .db-btn.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink);
  }
  .db-btn.danger {
    background: transparent;
    color: var(--unpaid);
    border: 1px solid var(--unpaid-bg);
  }
  .db-btn.small { padding: 5px 10px; font-size: 11.5px; }

  .db-form {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 18px;
  }
  .db-form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin-bottom: 12px;
  }
  .db-field label {
    display: block;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .db-field input, .db-field select, .db-field textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 13px;
    font-family: 'Work Sans', sans-serif;
    background: #fff;
    color: var(--ink);
  }
  .db-field input:focus, .db-field select:focus, .db-field textarea:focus {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
  }

  .db-empty {
    text-align: center;
    padding: 30px 20px;
    color: var(--ink-soft);
    font-size: 13.5px;
  }

  .db-search {
    font-family: 'Work Sans', sans-serif;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--card);
    color: var(--ink);
    width: 100%;
    max-width: 280px;
  }
  .db-search:focus { outline: 2px solid var(--gold); outline-offset: 1px; }

  .db-mono { font-family: 'IBM Plex Mono', monospace; }

  /* ---- Ukurasa wa Nyumbani: Hero, vyumba, dira/dhamira, footer ---- */
  .db-hero {
    position: relative;
    background: radial-gradient(circle at 15% 20%, #24382F 0%, var(--ink) 45%, #16221D 100%);
    background-size: cover;
    background-position: center;
    color: #fff;
    text-align: center;
    padding: 56px 24px 46px;
    overflow: hidden;
    margin: -18px -20px 0 -20px;
  }
  .db-hero::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle, rgba(233,213,150,0.10) 1.5px, transparent 1.5px);
    background-size: 26px 26px;
    opacity: 0.5;
  }
  .db-hero::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(28,43,38,0.35), rgba(28,43,38,0.82));
  }
  .db-hero[style*="background-image"]::after {
    background: linear-gradient(180deg, rgba(28,43,38,0.55), rgba(28,43,38,0.88));
  }
  .db-hero-inner { position: relative; z-index: 1; }
  .db-hero-title {
    font-family: 'Lora', serif;
    font-weight: 700;
    font-size: 30px;
    margin: 0 0 8px;
  }
  .db-hero-sub {
    font-size: 14px;
    color: #E9D596;
    margin: 0 0 22px;
  }

  .db-room-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin: 18px 0 8px;
  }
  .db-room-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 14px;
    text-align: center;
  }
  .db-room-box .rb-icon { font-size: 22px; margin-bottom: 6px; }
  .db-room-box .rb-room { font-family:'Lora',serif; font-weight:600; font-size: 16px; color: var(--ink); }
  .db-room-box .rb-prop { font-size: 12px; color: var(--ink-soft); margin: 3px 0 8px; }

  .db-vm-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    margin: 16px 0;
  }
  .db-vm-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .db-vm-card h4 {
    font-family: 'Lora', serif;
    font-size: 15px;
    margin: 0 0 8px;
    color: var(--gold-deep);
  }
  .db-vm-card p { font-size: 13px; color: var(--ink-soft); margin: 0; line-height: 1.5; }

  .db-home-content {
    position: relative;
    flex: 1 1 auto;
    background-size: cover;
    background-position: center;
    display: flex;
    flex-direction: column;
    margin: 0 -20px;
    padding: 0 20px;
  }
  .db-home-content::before {
    content: "";
    position: absolute; inset: 0;
    background: rgba(239,234,224,0.60);
  }
  .db-home-content > * { position: relative; z-index: 1; }

  .db-page-bg {
    position: relative;
    flex: 1 1 auto;
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: -18px -20px 0 -20px;
    padding: 30px 20px;
  }
  .db-page-bg::before {
    content: "";
    position: absolute; inset: 0;
    background: rgba(239,234,224,0.62);
  }
  .db-page-bg > * { position: relative; z-index: 1; width: 100%; }

  .db-info-section {
    max-width: 720px;
    margin: 8px auto;
    padding: 0 20px;
  }
  .db-info-title {
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: 17px;
    margin: 26px 0 10px;
    text-align: center;
  }
  .db-contact-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 22px;
    flex-wrap: wrap;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .db-contact-row span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .db-footer {
    background: var(--ink);
    color: #C9C2AE;
    text-align: center;
    font-size: 12px;
    padding: 16px 20px;
    margin: auto -20px -24px -20px;
    border-radius: 0;
  }
  .db-actions-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .db-toast {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--bg);
    padding: 9px 18px;
    border-radius: 20px;
    font-size: 13px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 100;
  }
  .db-toast.show { opacity: 1; }

  @media (max-width: 480px) {
    table.db-table { font-size: 12px; }
    table.db-table th, table.db-table td { padding: 7px 8px; }
  }
</style>
</head>

  const MONTHS_SW = ['Januari','Februari','Machi','Aprili','Mei','Juni','Julai','Agosti','Septemba','Oktoba','Novemba','Desemba'];

  function fmtMonth(ym){
    if(!ym) return '';
    const [y,m] = ym.split('-');
    return MONTHS_SW[parseInt(m,10)-1] + ' ' + y;
  }
  function fmtDate(d){
    if(!d) return '—';
    const dt = new Date(d + 'T00:00:00');
    return dt.getDate() + ' ' + MONTHS_SW[dt.getMonth()].slice(0,3) + ' ' + dt.getFullYear();
  }
  function money(n){
    n = Number(n)||0;
    return n.toLocaleString('en-US');
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function addPasswordToggles(container){
    container.querySelectorAll('input[type="password"]').forEach(input=>{
      if(input.dataset.pwToggled) return;
      input.dataset.pwToggled = '1';
      const wrapper = document.createElement('div');
      wrapper.style.position = 'relative';
      input.parentNode.insertBefore(wrapper, input);
      wrapper.appendChild(input);
      input.style.paddingRight = '42px';
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = 'Onyesha';
      btn.style.cssText = 'position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:11px;font-weight:600;padding:4px 6px;color:var(--gold-deep);';
      btn.addEventListener('click', ()=>{
        if(input.type==='password'){ input.type='text'; btn.textContent='Ficha'; }
        else { input.type='password'; btn.textContent='Onyesha'; }
      });
      wrapper.appendChild(btn);
    });
  }

  function bindEnterToClick(inputIds, buttonId){
    inputIds.forEach(id=>{
      const el = document.getElementById(id);
      if(el){
        el.addEventListener('keydown', e=>{
          if(e.key==='Enter' && el.tagName!=='TEXTAREA'){
            e.preventDefault();
            const btn = document.getElementById(buttonId);
            if(btn) btn.click();
          }
        });
      }
    });
  }
  function bindSearchInput(inputId, varSetter){
    const el = document.getElementById(inputId);
    if(!el) return;
    el.addEventListener('input', (e)=>{
      const cursor = e.target.selectionStart;
      varSetter(e.target.value);
      render();
      const fresh = document.getElementById(inputId);
      if(fresh){ fresh.focus(); fresh.setSelectionRange(cursor,cursor); }
    });
  }
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(()=>toastEl.classList.remove('show'), 2200);
  }

  async function getJSONWithRetry(key, attempts=3){
    let lastErr = null;
    for(let i=0;i<attempts;i++){
      try{ return await getJSON(key); }
      catch(e){ lastErr = e; await new Promise(r=>setTimeout(r, 400*(i+1))); }
    }
    throw lastErr;
  }

  // Inasoma faili la picha na kuipunguza ukubwa (max 500px upande mrefu zaidi)
  // kabla ya kuihifadhi kama base64 ndani ya Firestore (kuepuka picha kubwa mno)
  function resizeImageFile(file, maxDim=500, quality=0.75){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = (e)=>{
        const img = new Image();
        img.onload = ()=>{
          let w = img.width, h = img.height;
          if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
          else if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function isStrongPassword(pw){
    if(!pw || pw.length < 8) return false;
    if(!/[A-Z]/.test(pw)) return false;
    if(!/[a-z]/.test(pw)) return false;
    if(!/[0-9]/.test(pw)) return false;
    if(!/[^A-Za-z0-9]/.test(pw)) return false;
    return true;
  }

  function generatePassword(len=10){
    const upper='ABCDEFGHJKLMNPQRSTUVWXYZ', lower='abcdefghjkmnpqrstuvwxyz', digits='23456789', special='!@#$%*?';
    const all = upper+lower+digits+special;
    let out = upper[Math.floor(Math.random()*upper.length)]
            + lower[Math.floor(Math.random()*lower.length)]
            + digits[Math.floor(Math.random()*digits.length)]
            + special[Math.floor(Math.random()*special.length)];
    for(let i=0;i<len-4;i++) out += all[Math.floor(Math.random()*all.length)];
    return out.split('').sort(()=>Math.random()-0.5).join('');
  }

  async function createAuthUserViaRest(email, password){
    const resp = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+firebaseConfig.apiKey, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email, password, returnSecureToken:false})

  function paidTotalFor(tenantId){
    return payments.filter(p=>p.tenantId===tenantId)
      .reduce((s,p)=>s+Number(p.amount||0),0);
  }
  function monthsElapsed(t){
    if(!t.moveInDate) return 0;
    const start = new Date(t.moveInDate + 'T00:00:00');
    const endStr = (t.status==='left' && t.moveOutDate) ? t.moveOutDate : new Date().toISOString().slice(0,10);
    const end = new Date(endStr + 'T00:00:00');
    let months = (end.getFullYear()-start.getFullYear())*12 + (end.getMonth()-start.getMonth()) + 1;
    return Math.max(months, 0);
  }
  // Inarudisha null kama kodi ya mwezi haijawekwa (hatuwezi kuhesabu deni)
  function totalOwed(t){
    const rent = Number(t.rentAmount||0);
    if(!rent) return null;
    const months = monthsElapsed(t);
    const expected = months * rent;
    const paid = paidTotalFor(t.id);
    return expected - paid;
  }

  function currentYM(t){
    const endStr = (t.status==='left' && t.moveOutDate) ? t.moveOutDate : new Date().toISOString().slice(0,10);
    return endStr.slice(0,7);
  }

  // Inagawanya deni la jumla (linalotokana na totalOwed - salio halisi) kuwa
  // "deni la mwezi huu" na "deni la nyuma", BILA kutegemea ni mwezi gani
  // kila malipo yaliwekwa dhidi yake. Hii inahakikisha malipo yoyote
  // (hata kama ni zaidi ya deni la mwezi mmoja) yanapunguza deni la jumla
  // sahihi, na ukilipa zaidi, ziada inabaki kama "credit" inayopunguza
  // deni la miezi ijayo kiotomatiki.
  function debtBreakdown(t){
    const rent = Number(t.rentAmount||0);
    if(!rent || !t.moveInDate) return null;
    const total = totalOwed(t); // salio la jumla: chanya=anadaiwa, hasi/sifuri=amelipa vizuri au ana ziada
    const thisYM = currentYM(t);
    if(total <= 0){
      return { arrears: 0, thisMonthDue: 0, thisYM, total };
    }
    const thisMonthDue = Math.min(total, rent);
    const arrears = total - thisMonthDue;
    return { arrears, thisMonthDue, thisYM, total };
  }

  function oweBadgeHtml(t){
    const d = debtBreakdown(t);
    if(d===null) return '—';
    if(d.thisMonthDue<=0 && d.arrears<=0){
      return `<span class="db-badge badge-paid">Hana deni</span>`;
    }
    let html = d.thisMonthDue>0
      ? `<span class="db-badge badge-unpaid">${money(d.thisMonthDue)}</span>`
      : `<span class="db-badge badge-paid">Mwezi huu sawa</span>`;
    if(d.arrears>0){
      html += `<div style="font-size:11px;color:var(--unpaid);margin-top:3px;">+ deni la nyuma: ${money(d.arrears)}</div>`;
    }
    return html;
  }

  async function reconcileWithNewExcel(){
    let changed = 0;
    // Rekebisha majina ya vyumba vya Nyumba Mpya kutoka No.33-40 kwenda No.1-8
    const mpyaRenames = {"room_No33":"No. 1","room_No34":"No. 2","room_No35":"No. 3","room_No36":"No. 4","room_No37":"No. 5","room_No38":"No. 6","room_No39":"No. 7","room_No40":"No. 8"};
    Object.keys(mpyaRenames).forEach(rid=>{
      const r = rooms.find(x=>x.id===rid);
      if(r && r.name !== mpyaRenames[rid]){ r.name = mpyaRenames[rid]; changed++; }
    });

    Object.keys(CORRECTED_PAYMENTS_2026).forEach(tenantId=>{
      const t = tenants.find(x=>x.id===tenantId);
      if(!t) return;
      const monthMap = CORRECTED_PAYMENTS_2026[tenantId];
      for(let mm=1; mm<=12; mm++){
        const mmStr = String(mm).padStart(2,'0');
        const forMonth = `2026-${mmStr}`;
        const newAmt = monthMap[mmStr];
        const payId = `pay_${tenantId}_${mmStr}`;
        const existingIdx = payments.findIndex(p=>p.id===payId);
        if(newAmt){
          if(existingIdx>=0){
            if(Number(payments[existingIdx].amount)!==newAmt){
              payments[existingIdx].amount = String(newAmt);
              changed++;
            }
          } else {
            payments.push({id:payId, tenantId, roomId:t.roomId, date:`2026-${mmStr}-01`, forMonth, amount:String(newAmt), notes:''});
            changed++;
          }
        } else if(existingIdx>=0){
          payments.splice(existingIdx,1);
          changed++;
        }
      }
    });
    await saveRooms();
    await savePayments();
    appConfig.hasReconciled = true;
    await saveAppConfig();
    toast(changed ? `Malipo yamesahihishwa: mabadiliko ${changed}` : 'Hakuna tofauti iliyopatikana');
  }

          role:'tenant', tenantId:null, username, phone, name, photoData: regPhotoData, ...profileExtra,

        await auth.signOut();
        toast('Umesajiliwa! Subiri uthibitishwe na mwenye nyumba.');
        viewMode='home';
        render();
      }catch(e){
        submitBtn.disabled = false; submitBtn.textContent = 'Jisajili';
        if(e.code==='auth/email-already-in-use'){ errEl.textContent = 'Username hiyo tayari inatumika, jaribu nyingine.'; }
        else if(e.code==='auth/weak-password'){ errEl.textContent = 'Password ni dhaifu, weka ndefu zaidi.'; }
        else { errEl.textContent = 'Hitilafu: ' + e.message; }
      }
    });
  }

  function routeAfterLogin(){
    if(!currentProfile){ viewMode='home'; render(); return; }
    if(needsPasswordChange(currentProfile)){ viewMode='forceChangePassword'; render(); return; }
    if(currentProfile.role==='landlord'){ viewMode='admin'; activeTab='muhtasari'; render(); return; }
    if(currentProfile.role==='tenant'){
      if(currentProfile.status!=='active'){ viewMode='tenantPendingNotice'; render(); return; }
      viewMode='tenantPortal'; render(); return;
    }
    viewMode='home'; render();
  }

      </div>
    `;
    bindEnterToClick(['fcp-old','fcp-new','fcp-new2'], 'fcp-submit');
    addPasswordToggles(bodyEl);
    document.getElementById('fcp-submit').addEventListener('click', async ()=>{
      const oldPass = document.getElementById('fcp-old').value;
      const newPass = document.getElementById('fcp-new').value;
      const newPass2 = document.getElementById('fcp-new2').value;
      const errEl = document.getElementById('fcp-error');
      errEl.textContent = '';
      if(!isStrongPassword(newPass)){ errEl.textContent = PASSWORD_HINT; return; }
      if(newPass !== newPass2){ errEl.textContent = 'Password mpya hazifanani.'; return; }
      try{
        const cred = firebase.auth.EmailAuthProvider.credential(currentUser.email, oldPass);
        await currentUser.reauthenticateWithCredential(cred);
        await currentUser.updatePassword(newPass);
        currentProfile.passwordLastChanged = new Date().toISOString().slice(0,10);
        currentProfile.mustChangePassword = false;
        userProfiles[currentUser.uid] = currentProfile;
        await saveUserProfiles();
        toast('Password imebadilishwa!');
        routeAfterLogin();
      }catch(e){
        errEl.textContent = e.code==='auth/wrong-password' ? 'Password ya sasa si sahihi.' : ('Hitilafu: '+e.message);
      }
    });
  }

  // ---------- ADMIN: UTHIBITISHAJI WA WAPANGAJI WAPYA ----------
  function renderUthibitishaji(){
    // Chanzo cha msingi ni userProfiles (kila mpangaji aliyejisajili anahifadhiwa humo
    // moja kwa moja), si pendingRegistrations pekee — hii inazuia matatizo kama hati
    // ya pendingRegistrations ikikosekana kwa sababu yoyote, usajili usipotee.
    const pendingUids = Object.keys(userProfiles).filter(uid=>{
      const p = userProfiles[uid];
      return p.role==='tenant' && p.status==='pending';
    });
    const vacant = vacantRooms();

    const rowsHtml = pendingUids.map(regUid=>{
      const p = userProfiles[regUid];
      const regEntry = pendingRegistrations.find(r=>r.uid===regUid);
      const submittedAt = p.submittedAt || (regEntry && regEntry.submittedAt) || p.passwordLastChanged || '';
      const selVal = pendingRoomChoice[regUid] || '';
      const opts = '<option value="">-- Chagua chumba --</option>' + vacant.map(rm=>'<option value="'+rm.id+'"'+(selVal===rm.id?' selected':'')+'>'+propertyName(rm.propertyId)+' - '+rm.name+'</option>').join('');
      const photoHtml = p.photoData
        ? ('<img src="'+p.photoData+'" style="width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--border);">')
        : '<span class="db-badge badge-left">Hana picha</span>';
      return '<tr><td>'+photoHtml+'</td><td>'+(p.name||'—')+'</td><td class="db-mono">'+(p.phone||'—')+'</td><td class="db-mono">'+(p.username||'—')+'</td><td class="db-mono">'+(submittedAt?fmtDate(submittedAt):'—')+'</td>'
        + '<td><select class="db-search" data-room-choice="'+regUid+'" style="max-width:220px;">'+opts+'</select></td>'
        + '<td><div class="db-actions-row"><button class="db-btn small" data-verify="'+regUid+'">Thibitisha</button><button class="db-btn danger small" data-reject="'+regUid+'">Kataa</button></div></td></tr>';
    }).join('');
    const tableHtml = pendingUids.length
      ? ('<table class="db-table"><thead><tr><th>Picha</th><th>Jina</th><th>Simu</th><th>Username</th><th>Aliomba</th><th>Mpe chumba</th><th></th></tr></thead><tbody>'+rowsHtml+'</tbody></table>')
      : '<div class="db-empty">Hakuna usajili unaosubiri kwa sasa.</div>';

    bodyEl.innerHTML = `
      <div class="db-section-title">Usajili Unaosubiri Uthibitisho</div>
      <div class="db-table-wrap">${tableHtml}</div>
    `;

    bodyEl.querySelectorAll('[data-room-choice]').forEach(sel=>{
      sel.addEventListener('change', (e)=>{ pendingRoomChoice[sel.dataset.roomChoice] = e.target.value; });
    });
    bodyEl.querySelectorAll('[data-verify]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const regUid = btn.dataset.verify;
        const roomId = pendingRoomChoice[regUid];
        if(!roomId){ toast('Chagua chumba kwanza'); return; }
        const p = userProfiles[regUid];
        if(!p){ toast('Taarifa za mpangaji huyu hazipatikani tena'); return; }
        const newTenantId = uid();
        tenants.push({
          id:newTenantId, name:p.name, phone:p.phone, roomId,
          rentAmount:'', moveInDate: new Date().toISOString().slice(0,10),
          notes:'', status:'active', moveOutDate:'', photoData: p.photoData || '',
          gender: p.gender||'', marital: p.marital||'', boys: p.boys||0, girls: p.girls||0,
          withParents: p.withParents||'', age: p.age||'', tribe: p.tribe||'', job: p.job||''
        });
        await saveTenants();
        p.status='active';
        p.tenantId=newTenantId;
        await saveUserProfiles();
        const reg = pendingRegistrations.find(r=>r.uid===regUid);
        if(reg){ reg.status='verified'; await savePendingRegistrations(); }
        toast('Mpangaji amethibitishwa na kupewa chumba');
        renderUthibitishaji();
      });
    });
    bodyEl.querySelectorAll('[data-reject]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const regUid = btn.dataset.reject;
        const p = userProfiles[regUid];
        if(!p){ toast('Taarifa za mpangaji huyu hazipatikani tena'); return; }
        p.status='rejected';
        await saveUserProfiles();
        const reg = pendingRegistrations.find(r=>r.uid===regUid);
        if(reg){ reg.status='rejected'; await savePendingRegistrations(); }
        toast('Usajili umekataliwa');
        renderUthibitishaji();
      });
    });
  }

  // ---------- NAKALA RUDUFU (BACKUP) ----------
  function renderNakala(){
    bodyEl.innerHTML = `
      <div class="db-form">
        <div class="db-section-title">Pakua Nakala Rudufu</div>
        <p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 12px;">
          Hii itapakua faili moja lenye data yako yote ya sasa (nyumba, vyumba, wapangaji, malipo, maoni, taarifa za akaunti). Hifadhi faili hili mahali salama (mfano Google Drive au barua pepe yako) mara kwa mara, ili kama kitu kikiharibika kwenye Firebase, uweze kurudisha data yako.
        </p>
        <button class="db-btn" id="download-backup">Pakua Nakala Sasa (.json)</button>
      </div>

      <div class="db-form" style="border-color:var(--unpaid);">
        <div class="db-section-title">Rejesha Kutoka Nakala</div>
        <p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 12px;">
          ⚠️ Hii itafuta data ya sasa na kuweka data ya kwenye faili la nakala badala yake. Tumia tu kama una uhakika (mfano baada ya kupoteza data kwa bahati mbaya). Haitaweza kurudisha akaunti za watumiaji zilizofutwa kwenye Firebase Authentication — inarejesha tu taarifa za nyumba, wapangaji, malipo na maoni.
        </p>
        <input type="file" id="restore-file" accept=".json" style="margin-bottom:12px;">
        <div>
          <button class="db-btn danger" id="restore-backup">Rejesha Nakala</button>
        </div>
      </div>
    `;

    document.getElementById('download-backup').addEventListener('click', ()=>{
      const backup = {
        exportedAt: new Date().toISOString(),
        rooms, tenants, payments, properties, landlordInfo,
        userProfiles, pendingRegistrations, feedback: feedbackList, appConfig, siteContent
      };
      const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const dateStr = new Date().toISOString().slice(0,10);
      a.href = url;
      a.download = 'daftari-la-kodi-backup-' + dateStr + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast('Nakala imepakuliwa');
    });

    document.getElementById('restore-backup').addEventListener('click', async ()=>{
      const fileInput = document.getElementById('restore-file');
      const file = fileInput.files[0];
      if(!file){ toast('Chagua faili la nakala kwanza'); return; }
      const sure = confirm('Una uhakika? Hii itabadilisha data yote ya sasa na data ya kwenye faili hili.');
      if(!sure) return;
      try{
        const text = await file.text();
        const data = JSON.parse(text);
        if(data.rooms) rooms = data.rooms;
        if(data.tenants) tenants = data.tenants;
        if(data.payments) payments = data.payments;
        if(data.properties) properties = data.properties;
        if(data.landlordInfo) landlordInfo = data.landlordInfo;
        if(data.userProfiles) userProfiles = data.userProfiles;
        if(data.pendingRegistrations) pendingRegistrations = data.pendingRegistrations;
        if(data.feedback) feedbackList = data.feedback;
        if(data.appConfig) appConfig = data.appConfig;
        if(data.siteContent) siteContent = data.siteContent;
        await saveRooms(); await saveTenants(); await savePayments(); await saveProperties();
        await saveLandlordInfo(); await saveUserProfiles(); await savePendingRegistrations();
        await saveFeedback(); await saveAppConfig(); await saveSiteContent();
        toast('Data imerejeshwa kikamilifu kutoka kwenye nakala');
        renderNakala();
      }catch(e){
        toast('Hitilafu: faili si sahihi au limeharibika');
      }
    });
  }

  // ---------- MIPANGILIO (PROFAILI YA MWENYE NYUMBA) ----------
  function renderMipangilio(){
    const li = landlordInfo;
    const photoPreviewHtml = li.photoData
      ? '<img src="'+li.photoData+'" style="width:80px;height:80px;object-fit:cover;border-radius:50%;border:1px solid var(--border);">'
      : '<span style="font-size:12px;color:var(--ink-soft);">Hakuna picha bado</span>';

    bodyEl.innerHTML = `
      <div class="db-form">
        <div class="db-section-title">Profaili Yako (Mwenye Nyumba)</div>
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:14px;">
          <div id="mp-photo-preview">${photoPreviewHtml}</div>
          <div>
            <label style="display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;">Badilisha picha</label>
            <input id="mp-photo" type="file" accept="image/*">
          </div>
        </div>
        <div class="db-form-grid">
          <div class="db-field"><label>Jina lako / la nyumba</label><input id="landlord-name" value="${li.name||''}" placeholder="mfano: Mzee Juma - Nyumba za Kupanga"></div>
          <div class="db-field"><label>Namba ya simu</label><input id="landlord-phone" value="${li.phone||''}" placeholder="07XXXXXXXX"></div>
          <div class="db-field"><label>Barua pepe (si lazima)</label><input id="landlord-email" value="${li.email||''}" placeholder="mfano: juma@gmail.com"></div>
        </div>
        <button class="db-btn secondary small" id="save-landlord">Hifadhi Profaili</button>
      </div>

      <div class="db-form">
        <div class="db-section-title">Badilisha Password Yako</div>
        <div class="db-form-grid">
          <div class="db-field"><label>Password ya sasa</label><input id="mp-old" type="password"></div>
          <div class="db-field"><label>Password mpya</label><input id="mp-new" type="password" placeholder="Angalau herufi 8"><span style="font-size:10.5px;color:var(--ink-soft);">Herufi kubwa, ndogo, namba na alama maalum</span></div>
          <div class="db-field"><label>Thibitisha password mpya</label><input id="mp-new2" type="password"></div>
        </div>
        <div id="mp-pw-error" style="color:var(--unpaid);font-size:12.5px;margin-bottom:10px;"></div>
        <button class="db-btn secondary" id="mp-change-pw">Badilisha Password</button>
      </div>
    `;
    addPasswordToggles(bodyEl);
    bindEnterToClick(['landlord-name','landlord-phone','landlord-email'], 'save-landlord');

    let newPhotoData = null;
    document.getElementById('mp-photo').addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      try{
        newPhotoData = await resizeImageFile(file);
        document.getElementById('mp-photo-preview').innerHTML = '<img src="'+newPhotoData+'" style="width:80px;height:80px;object-fit:cover;border-radius:50%;border:1px solid var(--border);">';
      }catch(err){ toast('Imeshindwa kusoma picha'); }
    });

    document.getElementById('save-landlord').addEventListener('click', async ()=>{
      landlordInfo = {
        name: document.getElementById('landlord-name').value.trim(),
        phone: document.getElementById('landlord-phone').value.trim(),
        email: document.getElementById('landlord-email').value.trim(),
        photoData: newPhotoData || li.photoData || ''
      };
      await saveLandlordInfo();
      toast('Profaili yako imehifadhiwa');
      renderMipangilio();
    });

    document.getElementById('mp-change-pw').addEventListener('click', async ()=>{
      const oldPass = document.getElementById('mp-old').value;
      const newPass = document.getElementById('mp-new').value;
      const newPass2 = document.getElementById('mp-new2').value;
      const errEl = document.getElementById('mp-pw-error');
      errEl.textContent = '';
      if(!isStrongPassword(newPass)){ errEl.textContent = PASSWORD_HINT; return; }
      if(newPass !== newPass2){ errEl.textContent = 'Password mpya hazifanani.'; return; }
      try{
        const cred = firebase.auth.EmailAuthProvider.credential(currentUser.email, oldPass);
        await currentUser.reauthenticateWithCredential(cred);
        await currentUser.updatePassword(newPass);
        currentProfile.passwordLastChanged = new Date().toISOString().slice(0,10);
        currentProfile.mustChangePassword = false;
        userProfiles[currentUser.uid] = currentProfile;
        await saveUserProfiles();
        toast('Password yako imebadilishwa!');
        document.getElementById('mp-old').value='';
        document.getElementById('mp-new').value='';
        document.getElementById('mp-new2').value='';
      }catch(e){
        errEl.textContent = e.code==='auth/wrong-password' ? 'Password ya sasa si sahihi.' : ('Hitilafu: '+e.message);
      }
    });
  }

  // ---------- NYUMBA ----------
  function renderNyumba(){
    const editing = editingPropertyId ? properties.find(p=>p.id===editingPropertyId) : null;
    const filteredProps = searchNyumba
      ? properties.filter(p=>p.name.toLowerCase().includes(searchNyumba.toLowerCase()))
      : properties;
    const rows = filteredProps.map(p=>{
      const roomCount = rooms.filter(r=>r.propertyId===p.id).length;
      const tenantCount = tenants.filter(t=>t.status==='active' && propertyOfRoom(t.roomId)===p.id).length;
      return `<tr>
        <td>${p.name}</td>
        <td class="db-mono">${roomCount}</td>
        <td class="db-mono">${tenantCount}</td>
        <td>
          <div class="db-actions-row">
            <button class="db-btn secondary small" data-edit-property="${p.id}">Hariri</button>
            <button class="db-btn danger small" data-del-property="${p.id}">Futa</button>
          </div>
        </td>
      </tr>`;
    }).join('');

    const alreadyImported = tenants.some(t=>IMPORT_DATA.tenants.some(it=>it.id===t.id));
    const reconcileBtnHtml = alreadyImported
      ? (appConfig.hasReconciled
          ? '<button class="db-btn secondary" disabled style="margin-left:8px;opacity:0.5;cursor:not-allowed;">Tayari imesahihishwa ✓</button>'
          : '<button class="db-btn secondary" id="reconcile-excel" style="margin-left:8px;">Sahihisha malipo kwa Excel mpya</button>')
      : '';
    const updateV2BtnHtml = appConfig.hasUpdatedV2
      ? '<button class="db-btn secondary" disabled style="opacity:0.5;cursor:not-allowed;">Tayari imesasishwa ✓</button>'
      : '<button class="db-btn" id="update-v2-excel">Sasisha Data (Excel Mpya)</button>';
    const cancelEditPropHtml = editing ? '<button class="db-btn secondary" id="cancel-edit-property">Ghairi</button>' : '';
    const nyumbaTableHtml = filteredProps.length
      ? ('<table class="db-table"><thead><tr><th>Nyumba</th><th>Idadi ya vyumba</th><th>Wapangaji wanaoishi</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>')
      : ('<div class="db-empty">'+(searchNyumba ? 'Hakuna nyumba iliyopatikana.' : 'Bado hujaongeza nyumba yoyote. Ongeza nyumba kwanza kabla ya kuongeza vyumba vyake.')+'</div>');

    bodyEl.innerHTML = `
      <div class="db-form" style="border-color:var(--gold);">
        <div class="db-section-title">Ingiza data ya awali kutoka Excel</div>
        <p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 10px;">
          Hii itaingiza mara moja: nyumba 2 (Nyumba Dar - vyumba 32, Nyumba Mpya - vyumba 8), wapangaji wote 40 wanaoishi sasa (majina, simu, kodi), na malipo yaliyorekodiwa kwa mwaka 2026 kutoka faili lako la Excel. Tarehe ya kuingia imewekwa 1 Januari 2026 kwa wote, hivyo deni linahesabika kuanzia mwaka huu — deni la miaka ya nyuma (2025 na kabla) halijaingizwa moja kwa moja.
        </p>
        <button class="db-btn" id="import-excel" ${alreadyImported?'disabled style="opacity:0.5;cursor:not-allowed;"':''}>${alreadyImported ? 'Tayari imeingizwa ✓' : 'Ingiza data ya Excel sasa'}</button>
        ${reconcileBtnHtml}
      </div>
      <div class="db-form" style="border-color:var(--paid);">
        <div class="db-section-title">Sasisha Data kwa Excel Mpya (Book1.xlsx)</div>
        <p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 10px;">
          Hii itasasisha majina/simu/kodi ya wapangaji 40 wa awali kutoka Excel yako mpya, na kubadilisha kabisa historia yao ya malipo iendane na Excel hiyo. Chumba kilichoonyesha "hakuna mkazi" kitawekwa "Ametoka" kiotomatiki. Hii ni mara MOJA tu.
        </p>
        ${updateV2BtnHtml}
      </div>
      <div class="db-form">
        <div class="db-section-title">${editing ? 'Hariri nyumba' : 'Ongeza nyumba'}</div>
        <div class="db-form-grid">
          <div class="db-field"><label>Jina la nyumba</label><input id="property-name" value="${editing?editing.name:''}" placeholder="mfano: Nyumba Dar, Nyumba Mpya"></div>
        </div>
        <div class="db-actions-row">
          <button class="db-btn" id="add-property">${editing ? 'Hifadhi mabadiliko' : 'Hifadhi nyumba'}</button>
          ${cancelEditPropHtml}
        </div>
      </div>
      <div class="db-section-title"><span>Orodha ya nyumba</span><input type="text" class="db-search" id="search-nyumba" placeholder="Tafuta nyumba..." value="${searchNyumba}"></div>
      <div class="db-table-wrap">
        ${nyumbaTableHtml}
      </div>
    `;

    bindSearchInput('search-nyumba', v=>{ searchNyumba=v; });
    bindEnterToClick(['property-name'], 'add-property');
    const importBtn = document.getElementById('import-excel');
    if(importBtn && !alreadyImported){
      importBtn.addEventListener('click', async ()=>{
        importBtn.disabled = true;
        importBtn.textContent = 'Inaingiza...';
        await importFromExcel();
        renderNyumba();
      });
    }
    const reconcileBtn = document.getElementById('reconcile-excel');
    if(reconcileBtn){
      reconcileBtn.addEventListener('click', async ()=>{
        const sure = confirm('Hii itasahihisha mara MOJA TU majina ya vyumba vya Nyumba Mpya na baadhi ya malipo ya awali kutoka Excel. Baada ya hapo, kitufe hiki hakitatumika tena. Endelea?');
        if(!sure) return;
        reconcileBtn.disabled = true;
        reconcileBtn.textContent = 'Inasahihisha...';
        await reconcileWithNewExcel();
        renderNyumba();
      });
    }
    const updateV2Btn = document.getElementById('update-v2-excel');
    if(updateV2Btn){
      updateV2Btn.addEventListener('click', async ()=>{
        const sure = confirm('Hii itabadilisha kabisa majina/simu/kodi na HISTORIA YOTE ya malipo ya wapangaji 40 wa awali, iendane na Excel yako mpya. Hatua hii haiwezi kurudishwa nyuma. Una uhakika?');
        if(!sure) return;
        updateV2Btn.disabled = true;
        updateV2Btn.textContent = 'Inasasisha...';
        await applyUpdateV2();
        renderNyumba();
      });
    }

    document.getElementById('add-property').addEventListener('click', async ()=>{
      const name = document.getElementById('property-name').value.trim();
      if(!name){ toast('Andika jina la nyumba'); return; }
      if(editing){
        editing.name = name;
        toast('Nyumba imesahihishwa');
      } else {
        properties.push({id: uid(), name});
        toast('Nyumba imeongezwa');
      }
      await saveProperties();
      editingPropertyId = null;
      renderNyumba();
    });
    const cancelEditPropBtn = document.getElementById('cancel-edit-property');
    if(cancelEditPropBtn) cancelEditPropBtn.addEventListener('click', ()=>{ editingPropertyId=null; renderNyumba(); });
    bodyEl.querySelectorAll('[data-edit-property]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ editingPropertyId = btn.dataset.editProperty; renderNyumba(); window.scrollTo(0,0); });
    });
    bodyEl.querySelectorAll('[data-del-property]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.dataset.delProperty;
        if(rooms.some(r=>r.propertyId===id)){
          toast('Nyumba hii ina vyumba, futa vyumba vyake kwanza');
          return;
        }
        properties = properties.filter(p=>p.id!==id);
        await saveProperties();
        renderNyumba();
      });
    });
  }

  // ---------- MUHTASARI ----------
  function renderMuhtasari(){
    const filtered = dashPropertyFilter
      ? activeTenants().filter(t=>propertyOfRoom(t.roomId)===dashPropertyFilter)
      : activeTenants();
    let totalPaidThisMonth = 0;
    let totalOwedAll = 0;
    let waliolipa = 0, hawajalipa = 0, sehemu = 0, wenyeDeni = 0;

    const rows = filtered.map(t=>{
      const paid = paidForMonth(t.id, dashMonth);
      const expected = Number(t.rentAmount||0);
      const d = debtBreakdown(t);
      totalPaidThisMonth += paid;
      if(d && d.total>0){ totalOwedAll += d.total; wenyeDeni++; }
      let statusHtml;
      if(d===null){
        // hakuna kodi iliyowekwa, tumia mantiki ya zamani ya mwezi huu tu
        if(expected > 0 && paid >= expected){ statusHtml = `<span class="db-badge badge-paid">Amelipa kamili</span>`; waliolipa++; }
        else if(paid > 0){ statusHtml = `<span class="db-badge badge-partial">Amelipa kiasi</span>`; sehemu++; }
        else { statusHtml = `<span class="db-badge badge-unpaid">Hajalipa</span>`; hawajalipa++; }
      } else if(d.total <= 0){
        statusHtml = `<span class="db-badge badge-paid">Amelipa kamili</span>`; waliolipa++;
      } else if(d.thisMonthDue < expected){
        statusHtml = `<span class="db-badge badge-partial">Amelipa kiasi</span>`; sehemu++;
      } else {
        statusHtml = `<span class="db-badge badge-unpaid">Hajalipa</span>`; hawajalipa++;
      }
      const oweHtml = oweBadgeHtml(t);
      const kumbushaHtml = (d && d.total>0 && t.phone)
        ? ('<a class="db-btn small" style="background:#2F6B4F;text-decoration:none;display:inline-block;" href="https://wa.me/'+toIntlPhone(t.phone)+'?text='+encodeURIComponent(buildStatementForTenant(t))+'" target="_blank">Kumbusha (WhatsApp)</a>')
        : '';
      return `<tr>
        <td><a href="#" data-view-tenant="${t.id}" style="color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--border);cursor:pointer;">${t.name}</a></td>
        <td>${propertyName(propertyOfRoom(t.roomId))}</td>
        <td>${roomName(t.roomId)}</td>
        <td class="db-mono">${t.phone||'—'}</td>
        <td class="db-mono">${expected?money(expected):'—'}</td>
        <td class="db-mono">${money(paid)}</td>
        <td>${statusHtml}</td>
        <td>${oweHtml}</td>
        <td>
          <div class="db-actions-row">
            <button class="db-btn small" data-record="${t.id}">Rekodi malipo</button>
            ${kumbushaHtml}
          </div>
        </td>
      </tr>`;
    }).join('');

    const propFilterOptions = properties.map(p=>`<option value="${p.id}" ${dashPropertyFilter===p.id?'selected':''}>${p.name}</option>`).join('');
    const propSelectHtml = properties.length
      ? ('<select class="db-month-picker" id="dash-property"><option value="">Nyumba zote</option>'+propFilterOptions+'</select>')
      : '';
    const muhtasariTableHtml = filtered.length
      ? ('<table class="db-table"><thead><tr><th>Mpangaji</th><th>Nyumba</th><th>Chumba</th><th>Simu</th><th>Kodi</th><th>Amelipa mwezi huu</th><th>Hali</th><th>Deni</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>')
      : '<div class="db-empty">Hakuna mpangaji anayeishi kwa sasa. Nenda kwenye tab ya "Wapangaji" kuongeza.</div>';

    bodyEl.innerHTML = `
      <div class="db-section-title">
        <span>Muhtasari wa mwezi</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          ${propSelectHtml}
          <input type="month" class="db-month-picker" id="dash-month" value="${dashMonth}">
        </div>
      </div>
      <div class="db-cards">
        <div class="db-card"><div class="db-card-num">${filtered.length}</div><div class="db-card-label">Wapangaji wanaoishi</div></div>
        <div class="db-card"><div class="db-card-num" style="color:var(--paid)">${waliolipa}</div><div class="db-card-label">Wamelipa kamili</div></div>
        <div class="db-card"><div class="db-card-num" style="color:var(--partial)">${sehemu}</div><div class="db-card-label">Wamelipa kiasi</div></div>
        <div class="db-card"><div class="db-card-num" style="color:var(--unpaid)">${hawajalipa}</div><div class="db-card-label">Hawajalipa mwezi huu</div></div>
        <div class="db-card"><div class="db-card-num">${money(totalPaidThisMonth)}</div><div class="db-card-label">Imepokelewa (${fmtMonth(dashMonth)})</div></div>
        <div class="db-card"><div class="db-card-num" style="color:var(--unpaid)">${money(totalOwedAll)}</div><div class="db-card-label">Deni la jumla (${wenyeDeni} wenye deni)</div></div>
      </div>
      <div class="db-table-wrap">
        ${muhtasariTableHtml}
      </div>
    `;

    document.getElementById('dash-month').addEventListener('change', e=>{
      dashMonth = e.target.value;
      renderMuhtasari();
    });
    const propSel = document.getElementById('dash-property');
    if(propSel){
      propSel.addEventListener('change', e=>{
        dashPropertyFilter = e.target.value;
        renderMuhtasari();
      });
    }
    bodyEl.querySelectorAll('[data-record]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        activeTab='malipo';
        render();
        setTimeout(()=>{
          const sel = document.getElementById('pay-tenant');
          if(sel){ sel.value = btn.dataset.record; }
          const monthInput = document.getElementById('pay-month');
          if(monthInput){ monthInput.value = dashMonth; }
        }, 0);
      });
    });
    bodyEl.querySelectorAll('[data-view-tenant]').forEach(a=>{
      a.addEventListener('click', (e)=>{
        e.preventDefault();
        selectedTenantId = a.dataset.viewTenant;
        activeTab = 'tenantDetail';
        render();
        window.scrollTo(0,0);
      });
    });
  }

  // ---------- VYUMBA ----------
  function renderVyumba(){
    if(!properties.length){
      bodyEl.innerHTML = `<div class="db-empty">Kwanza ongeza nyumba kwenye tab ya "Nyumba" kabla ya kuongeza vyumba.</div>`;
      return;
    }
    const propOptions = properties.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');

    const sortedRooms = rooms.slice().sort((a,b)=>{
      const pa = propertyName(a.propertyId), pb = propertyName(b.propertyId);
      return pa.localeCompare(pb) || a.name.localeCompare(b.name);
    });
    const filteredRooms = searchVyumba
      ? sortedRooms.filter(r=>{
          const q = searchVyumba.toLowerCase();
          return r.name.toLowerCase().includes(q) || propertyName(r.propertyId).toLowerCase().includes(q);
        })
      : sortedRooms;
    const rows = filteredRooms.map(r=>{
      const occ = tenants.find(t=>t.roomId===r.id && t.status==='active');
      return `<tr>
        <td>${propertyName(r.propertyId)}</td>
        <td>${r.name}</td>
        <td>${occ ? occ.name : '<span class="db-badge badge-left">Wazi</span>'}</td>
        <td><button class="db-btn danger small" data-del-room="${r.id}">Futa</button></td>
      </tr>`;
    }).join('');

    const vyumbaTableHtml = filteredRooms.length
      ? ('<table class="db-table"><thead><tr><th>Nyumba</th><th>Chumba</th><th>Anayeishi sasa</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>')
      : ('<div class="db-empty">'+(searchVyumba ? 'Hakuna chumba kilichopatikana.' : 'Bado hujaongeza vyumba.')+'</div>');

    bodyEl.innerHTML = `
      <div class="db-form">
        <div class="db-section-title">Ongeza chumba</div>
        <div class="db-form-grid">
          <div class="db-field"><label>Nyumba</label><select id="room-property"><option value="">-- Chagua --</option>${propOptions}</select></div>
          <div class="db-field"><label>Jina/namba ya chumba</label><input id="room-name" placeholder="mfano: No. 3"></div>
        </div>
        <button class="db-btn" id="add-room">Hifadhi chumba</button>
      </div>
      <div class="db-section-title"><span>Orodha ya vyumba</span><input type="text" class="db-search" id="search-vyumba" placeholder="Tafuta chumba au nyumba..." value="${searchVyumba}"></div>
      <div class="db-table-wrap">
        ${vyumbaTableHtml}
      </div>
    `;

    bindSearchInput('search-vyumba', v=>{ searchVyumba=v; });
    bindEnterToClick(['room-name'], 'add-room');
    document.getElementById('add-room').addEventListener('click', async ()=>{
      const propertyId = document.getElementById('room-property').value;
      const name = document.getElementById('room-name').value.trim();
      if(!propertyId){ toast('Chagua nyumba'); return; }
      if(!name){ toast('Andika jina la chumba'); return; }
      rooms.push({id: uid(), name, propertyId});
      await saveRooms();
      toast('Chumba kimeongezwa');
      renderVyumba();
    });
    bodyEl.querySelectorAll('[data-del-room]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.dataset.delRoom;
        if(tenants.some(t=>t.roomId===id && t.status==='active')){
          toast('Chumba kina mpangaji, huwezi kukifuta');
          return;
        }
        rooms = rooms.filter(r=>r.id!==id);
        await saveRooms();
        renderVyumba();
      });
    });
  }

  // ---------- WAPANGAJI ----------
  function renderWapangaji(){
    const editing = editingTenantId ? tenants.find(t=>t.id===editingTenantId) : null;

    const roomOptionsHtml = properties.length
      ? properties.map(p=>{
          const opts = rooms.filter(r=>r.propertyId===p.id).map(r=>`<option value="${r.id}">${r.name}</option>`).join('');
          return opts ? `<optgroup label="${p.name}">${opts}</optgroup>` : '';
        }).join('')
      : rooms.map(r=>`<option value="${r.id}">${r.name}</option>`).join('');

    const sortedTenants = tenants.slice().sort((a,b)=> (b.moveInDate||'').localeCompare(a.moveInDate||''));
    const filteredTenants = searchWapangaji
      ? sortedTenants.filter(t=>{
          const q = searchWapangaji.toLowerCase();
          return t.name.toLowerCase().includes(q)
            || (t.phone||'').toLowerCase().includes(q)
            || roomName(t.roomId).toLowerCase().includes(q)
            || propertyName(propertyOfRoom(t.roomId)).toLowerCase().includes(q);
        })
      : sortedTenants;
    function hasLoginAccount(tenantId){
      return Object.values(userProfiles).some(p=>p.tenantId===tenantId);
    }

    const rows = filteredTenants.map(t=>{
      const statusBadge = t.status==='active'
        ? `<span class="db-badge badge-paid">Anaishi</span>`
        : `<span class="db-badge badge-left">Ametoka</span>`;
      const owed = totalOwed(t);
      const oweHtml = oweBadgeHtml(t);
      const checkoutBtnHtml = t.status==='active' ? ('<button class="db-btn small" data-checkout="'+t.id+'">Ametoka</button>') : '';
      const createAcctBtnHtml = (t.status==='active' && !hasLoginAccount(t.id))
        ? ('<button class="db-btn secondary small" data-create-account="'+t.id+'">Tengeneza Akaunti</button>')
        : '';
      const resetAccessBtnHtml = (t.status==='active' && hasLoginAccount(t.id))
        ? ('<button class="db-btn secondary small" data-reset-access="'+t.id+'">Weka Akaunti Mpya</button>')
        : '';
      const photoHtml = t.photoData
        ? ('<img src="'+t.photoData+'" style="width:36px;height:36px;object-fit:cover;border-radius:50%;border:1px solid var(--border);">')
        : '<span style="font-size:11px;color:var(--ink-soft);">—</span>';
      return `<tr>
        <td>${photoHtml}</td>
        <td><a href="#" data-view-tenant="${t.id}" style="color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--border);cursor:pointer;">${t.name}</a></td>
        <td class="db-mono">${t.phone||'—'}</td>
        <td>${propertyName(propertyOfRoom(t.roomId))}</td>
        <td>${roomName(t.roomId)}</td>
        <td class="db-mono">${fmtDate(t.moveInDate)}</td>
        <td class="db-mono">${t.status==='active' ? '—' : fmtDate(t.moveOutDate)}</td>
        <td>${statusBadge}</td>
        <td>${oweHtml}</td>
        <td>
          <div class="db-actions-row">
            <button class="db-btn secondary small" data-edit-tenant="${t.id}">Hariri</button>
            ${checkoutBtnHtml}
            ${createAcctBtnHtml}
            ${resetAccessBtnHtml}
          </div>
        </td>
      </tr>`;
    }).join('');

    const cancelEditTenantHtml = editing ? '<button class="db-btn secondary" id="cancel-edit">Ghairi</button>' : '';
    const wapangajiTableHtml = filteredTenants.length
      ? ('<table class="db-table"><thead><tr><th>Picha</th><th>Jina</th><th>Simu</th><th>Nyumba</th><th>Chumba</th><th>Aliingia</th><th>Alitoka</th><th>Hali</th><th>Deni</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>')
      : ('<div class="db-empty">'+(searchWapangaji ? 'Hakuna mpangaji aliyepatikana.' : 'Bado hujaongeza mpangaji yeyote.')+'</div>');

    bodyEl.innerHTML = `
      <div class="db-form">
        <div class="db-section-title">${editing ? 'Hariri mpangaji' : 'Ongeza mpangaji mpya'}</div>
        <div class="db-form-grid">
          <div class="db-field"><label>Jina</label><input id="t-name" value="${editing?editing.name:''}" placeholder="Jina kamili"></div>
          <div class="db-field"><label>Namba ya simu</label><input id="t-phone" value="${editing?(editing.phone||''):''}" placeholder="07XXXXXXXX"></div>
          <div class="db-field"><label>Chumba</label><select id="t-room"><option value="">-- Chagua --</option>${roomOptionsHtml}</select></div>
          <div class="db-field"><label>Kodi ya mwezi (si lazima)</label><input id="t-rent" type="number" value="${editing?(editing.rentAmount||''):''}" placeholder="mfano: 150000"></div>
          <div class="db-field"><label>Tarehe ya kuingia</label><input id="t-movein" type="date" value="${editing?(editing.moveInDate||''):''}"></div>
          <div class="db-field"><label>Maelezo ya ziada</label><input id="t-notes" value="${editing?(editing.notes||''):''}" placeholder="mfano: kazi, mawasiliano ya jamaa"></div>
        </div>
        <div class="db-actions-row">
          <button class="db-btn" id="save-tenant">${editing ? 'Hifadhi mabadiliko' : 'Ongeza mpangaji'}</button>
          ${cancelEditTenantHtml}
        </div>
      </div>
      <div class="db-section-title"><span>Orodha ya wapangaji</span><input type="text" class="db-search" id="search-wapangaji" placeholder="Tafuta jina, simu, chumba..." value="${searchWapangaji}"></div>
      <div class="db-table-wrap">
        ${wapangajiTableHtml}
      </div>
    `;

    if(editing){ document.getElementById('t-room').value = editing.roomId || ''; }
    bindSearchInput('search-wapangaji', v=>{ searchWapangaji=v; });
    bindEnterToClick(['t-name','t-phone','t-rent','t-movein','t-notes'], 'save-tenant');

    document.getElementById('save-tenant').addEventListener('click', async ()=>{
      const name = document.getElementById('t-name').value.trim();
      const phone = document.getElementById('t-phone').value.trim();
      const roomId = document.getElementById('t-room').value;
      const rentAmount = document.getElementById('t-rent').value;
      const moveInDate = document.getElementById('t-movein').value;
      const notes = document.getElementById('t-notes').value.trim();
      if(!name){ toast('Andika jina la mpangaji'); return; }
      if(!roomId){ toast('Chagua chumba'); return; }

      if(editing){
        Object.assign(editing, {name, phone, roomId, rentAmount, moveInDate, notes});
      } else {
        tenants.push({
          id: uid(), name, phone, roomId, rentAmount, moveInDate,
          notes, status:'active', moveOutDate:''
        });
      }
      await saveTenants();
      editingTenantId = null;
      toast('Taarifa za mpangaji zimehifadhiwa');
      renderWapangaji();
    });

    const cancelBtn = document.getElementById('cancel-edit');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ editingTenantId=null; renderWapangaji(); });

    bodyEl.querySelectorAll('[data-edit-tenant]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ editingTenantId = btn.dataset.editTenant; renderWapangaji(); window.scrollTo(0,0); });
    });
    bodyEl.querySelectorAll('[data-checkout]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const t = tenants.find(x=>x.id===btn.dataset.checkout);
        const date = prompt('Tarehe ya kutoka (YYYY-MM-DD):', new Date().toISOString().slice(0,10));
        if(date===null) return;
        t.status='left';
        t.moveOutDate = date;
        await saveTenants();
        const linkedUid = Object.keys(userProfiles).find(uid=>userProfiles[uid].tenantId===t.id);
        if(linkedUid){
          userProfiles[linkedUid].status = 'left';
          await saveUserProfiles();
        }
        toast('Mpangaji ameondolewa kwenye orodha ya wanaoishi na hataweza tena kuingia kwenye mfumo');
        renderWapangaji();
      });
    });
    bodyEl.querySelectorAll('[data-create-account]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const t = tenants.find(x=>x.id===btn.dataset.createAccount);
        const suggested = t.name.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,12) || 'mpangaji';
        const username = prompt('Weka username ya '+t.name+' (atatumia hii kuingia):', suggested);
        if(!username) return;
        const password = generatePassword();
        try{
          const uid = await createAuthUserViaRest(username.toLowerCase()+EMAIL_DOMAIN, password);
          userProfiles[uid] = {
            role:'tenant', tenantId: t.id, username: username.toLowerCase(), phone: t.phone, name: t.name,
            passwordLastChanged: new Date().toISOString().slice(0,10),
            mustChangePassword: true, status:'active'
          };
          await saveUserProfiles();
          alert('Akaunti imetengenezwa kwa '+t.name+':\n\nUsername: '+username.toLowerCase()+'\nPassword ya muda: '+password+'\n\nMpe taarifa hizi mpangaji (WhatsApp/SMS). Ataulizwa kubadili password anapoingia mara ya kwanza.');
          toast('Akaunti imetengenezwa');
          renderWapangaji();
        }catch(e){
          if(String(e.message).includes('EMAIL_EXISTS')){ alert('Username hiyo tayari inatumika, jaribu nyingine.'); }
          else { alert('Hitilafu: '+e.message); }
        }
      });
    });
    bodyEl.querySelectorAll('[data-reset-access]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const t = tenants.find(x=>x.id===btn.dataset.resetAccess);
        const sure = confirm('Una uhakika? Akaunti ya zamani ya '+t.name+' haitafanya kazi tena, na utatengeneza username/password mpya kabisa kwa ajili yake.');
        if(!sure) return;
        const oldUid = Object.keys(userProfiles).find(uid=>userProfiles[uid].tenantId===t.id);
        if(oldUid){
          userProfiles[oldUid].tenantId = null;
          userProfiles[oldUid].status = 'replaced';
          await saveUserProfiles();
        }
        toast('Akaunti ya zamani imeondolewa. Sasa bofya "Tengeneza Akaunti" kumpa mpya.');
        renderWapangaji();
      });
    });
    bodyEl.querySelectorAll('[data-view-tenant]').forEach(a=>{
      a.addEventListener('click', (e)=>{
        e.preventDefault();
        selectedTenantId = a.dataset.viewTenant;
        activeTab = 'tenantDetail';
        render();
        window.scrollTo(0,0);
      });
    });
  }

  // ---------- TAARIFA BINAFSI YA MPANGAJI ----------
  function renderTenantDetail(){
    const t = tenants.find(x=>x.id===selectedTenantId);
    if(!t){
      bodyEl.innerHTML = `<div class="db-empty">Mpangaji hajapatikana.</div>`;
      return;
    }
    const rent = Number(t.rentAmount||0);
    const paid = paidTotalFor(t.id);
    const d = debtBreakdown(t);
    const months = monthsElapsed(t);
    const history = payments.filter(p=>p.tenantId===t.id).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));

    const statementText = buildStatementForTenant(t);
    const waLink = t.phone ? ('https://wa.me/'+toIntlPhone(t.phone)+'?text='+encodeURIComponent(statementText)) : '';
    const smsLink = t.phone ? ('sms:'+t.phone+'?&body='+encodeURIComponent(statementText)) : '';
    const waBtnHtml = t.phone ? ('<a class="db-btn" style="background:#2F6B4F;text-decoration:none;display:inline-block;" href="'+waLink+'" target="_blank">Tuma WhatsApp</a>') : '';
    const smsBtnHtml = t.phone ? ('<a class="db-btn secondary" style="text-decoration:none;display:inline-block;" href="'+smsLink+'">Tuma SMS</a>') : '';
    const noPhoneNoteHtml = !t.phone ? '<span style="font-size:12px;color:var(--ink-soft);align-self:center;">Ongeza namba ya simu ya mpangaji ili kutuma moja kwa moja</span>' : '';

    const histRowsHtml2 = history.map(p=>{
      const waReceiptBtn = t.phone ? ('<a class="db-btn small" style="background:#2F6B4F;text-decoration:none;display:inline-block;" href="'+waLinkForReceipt(p)+'" target="_blank">WhatsApp</a>') : '';
      return '<tr><td class="db-mono">'+fmtDate(p.date)+'</td><td>'+fmtMonth(p.forMonth)+'</td><td class="db-mono">'+money(p.amount)+'</td><td>'+(p.notes||'—')+'</td><td><div class="db-actions-row"><button class="db-btn secondary small" data-print-receipt="'+p.id+'">Risiti</button>'+waReceiptBtn+'</div></td></tr>';
    }).join('');
    const histTableHtml2 = history.length
      ? ('<table class="db-table"><thead><tr><th>Tarehe</th><th>Mwezi aliolipia</th><th>Kiasi</th><th>Maelezo</th><th></th></tr></thead><tbody>'+histRowsHtml2+'</tbody></table>')
      : '<div class="db-empty">Bado hakuna malipo yaliyorekodiwa kwa mpangaji huyu.</div>';

    bodyEl.innerHTML = `
      <button class="db-btn secondary small" id="back-to-list" style="margin-bottom:14px;">&larr; Rudi kwenye orodha</button>
      <div class="db-section-title">
        ${t.photoData ? '<img src="'+t.photoData+'" style="width:44px;height:44px;object-fit:cover;border-radius:50%;border:1px solid var(--border);margin-right:10px;vertical-align:middle;">' : ''}
        <span style="vertical-align:middle;">${t.name}</span>
      </div>
      <div class="db-cards">
        <div class="db-card"><div class="db-card-num">${propertyName(propertyOfRoom(t.roomId))}</div><div class="db-card-label">Nyumba</div></div>
        <div class="db-card"><div class="db-card-num">${roomName(t.roomId)}</div><div class="db-card-label">Chumba</div></div>
        <div class="db-card"><div class="db-card-num">${rent?money(rent):'—'}</div><div class="db-card-label">Kodi ya mwezi</div></div>
        <div class="db-card"><div class="db-card-num">${months}</div><div class="db-card-label">Miezi tangu aingie</div></div>
        <div class="db-card"><div class="db-card-num" style="color:var(--paid)">${money(paid)}</div><div class="db-card-label">Jumla amelipa</div></div>
        <div class="db-card"><div class="db-card-num" style="color:${d&&d.thisMonthDue>0?'var(--unpaid)':'var(--paid)'}">${d?(d.thisMonthDue>0?money(d.thisMonthDue):'0'):'—'}</div><div class="db-card-label">Deni la mwezi huu</div></div>
        <div class="db-card"><div class="db-card-num" style="color:${d&&d.arrears>0?'var(--unpaid)':'var(--paid)'}">${d?(d.arrears>0?money(d.arrears):'0'):'—'}</div><div class="db-card-label">Deni la nyuma</div></div>
      </div>

      <div class="db-form">
        <div class="db-section-title">Ankara ya kutuma kwa mpangaji</div>
        <textarea id="statement-text" readonly rows="9" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:7px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;background:#fff;">${statementText}</textarea>
        <div class="db-actions-row" style="margin-top:10px;">
          ${waBtnHtml}
          ${smsBtnHtml}
          <button class="db-btn secondary" id="copy-statement">Nakili maandishi</button>
          ${noPhoneNoteHtml}
        </div>
      </div>

      <div class="db-table-wrap">
        ${histTableHtml2}
      </div>
    `;

    document.getElementById('back-to-list').addEventListener('click', ()=>{
      activeTab = 'wapangaji';
      render();
    });
    bodyEl.querySelectorAll('[data-print-receipt]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ printReceipt(btn.dataset.printReceipt); });
    });
    document.getElementById('copy-statement').addEventListener('click', async ()=>{
      const ta = document.getElementById('statement-text');
      try{
        await navigator.clipboard.writeText(ta.value);
        toast('Maandishi yamenakiliwa');
      }catch(e){
        ta.select();
        try{ document.execCommand('copy'); toast('Maandishi yamenakiliwa'); }
        catch(e2){ toast('Chagua maandishi na unakili wewe mwenyewe'); }
      }
    });
  }

  // ---------- MALIPO ----------
  function renderMalipo(){
    const tenantOptions = tenants.map(t=>`<option value="${t.id}">${t.name} — ${propertyName(propertyOfRoom(t.roomId))} / ${roomName(t.roomId)}</option>`).join('');

    const sorted = payments.slice().sort((a,b)=> (b.date||'').localeCompare(a.date||''));
    const filteredPayments = searchMalipo
      ? sorted.filter(p=>{
          const q = searchMalipo.toLowerCase();
          return tenantName(p.tenantId).toLowerCase().includes(q)
            || propertyName(propertyOfRoom(p.roomId)).toLowerCase().includes(q)
            || roomName(p.roomId).toLowerCase().includes(q)
            || fmtMonth(p.forMonth).toLowerCase().includes(q)
            || (p.notes||'').toLowerCase().includes(q);
        })
      : sorted;
    const rows = filteredPayments.map(p=>{
      const hasPhone = tenants.find(x=>x.id===p.tenantId && x.phone);
      const waBtn = hasPhone ? ('<a class="db-btn small" style="background:#2F6B4F;text-decoration:none;display:inline-block;" href="'+waLinkForReceipt(p)+'" target="_blank">WhatsApp</a>') : '';
      return '<tr><td class="db-mono">'+fmtDate(p.date)+'</td><td>'+tenantName(p.tenantId)+'</td><td>'+propertyName(propertyOfRoom(p.roomId))+'</td><td>'+roomName(p.roomId)+'</td><td>'+fmtMonth(p.forMonth)+'</td><td class="db-mono">'+money(p.amount)+'</td><td>'+(p.notes||'—')+'</td><td><div class="db-actions-row"><button class="db-btn secondary small" data-print-receipt="'+p.id+'">Risiti</button>'+waBtn+'<button class="db-btn danger small" data-del-payment="'+p.id+'">Futa</button></div></td></tr>';
    }).join('');

    const malipoTableHtml = filteredPayments.length
      ? ('<table class="db-table"><thead><tr><th>Tarehe</th><th>Mpangaji</th><th>Nyumba</th><th>Chumba</th><th>Mwezi</th><th>Kiasi</th><th>Maelezo</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>')
      : ('<div class="db-empty">'+(searchMalipo ? 'Hakuna malipo yaliyopatikana.' : 'Bado hakuna malipo yaliyorekodiwa.')+'</div>');

    bodyEl.innerHTML = `
      <div class="db-form">
        <div class="db-section-title">Rekodi malipo</div>
        <div class="db-form-grid">
          <div class="db-field"><label>Mpangaji</label><select id="pay-tenant"><option value="">-- Chagua --</option>${tenantOptions}</select></div>
          <div class="db-field"><label>Tarehe ya malipo</label><input id="pay-date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
          <div class="db-field"><label>Analipia mwezi gani</label><input id="pay-month" type="month" value="${new Date().toISOString().slice(0,7)}"></div>
          <div class="db-field"><label>Kiasi</label><input id="pay-amount" type="number" placeholder="mfano: 150000"></div>
          <div class="db-field"><label>Maelezo (si lazima)</label><input id="pay-notes" placeholder="mfano: malipo ya nusu"></div>
        </div>
        <button class="db-btn" id="save-payment">Hifadhi malipo</button>
      </div>
      <div class="db-section-title"><span>Historia ya malipo</span><input type="text" class="db-search" id="search-malipo" placeholder="Tafuta mpangaji, chumba, mwezi..." value="${searchMalipo}"></div>
      <div class="db-table-wrap">
        ${malipoTableHtml}
      </div>
    `;

    bindSearchInput('search-malipo', v=>{ searchMalipo=v; });
    bindEnterToClick(['pay-date','pay-month','pay-amount','pay-notes'], 'save-payment');

    document.getElementById('save-payment').addEventListener('click', async ()=>{
      const tenantId = document.getElementById('pay-tenant').value;
      const date = document.getElementById('pay-date').value;
      const forMonth = document.getElementById('pay-month').value;
      const amount = document.getElementById('pay-amount').value;
      const notes = document.getElementById('pay-notes').value.trim();
      if(!tenantId){ toast('Chagua mpangaji'); return; }
      if(!date || !forMonth){ toast('Jaza tarehe na mwezi'); return; }
      if(!amount || Number(amount)<=0){ toast('Andika kiasi sahihi'); return; }
      const t = tenants.find(x=>x.id===tenantId);
      payments.push({id: uid(), tenantId, roomId: t.roomId, date, forMonth, amount, notes});
      await savePayments();
      toast('Malipo yamehifadhiwa');
      renderMalipo();
    });

    bodyEl.querySelectorAll('[data-print-receipt]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ printReceipt(btn.dataset.printReceipt); });
    });
    bodyEl.querySelectorAll('[data-del-payment]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        payments = payments.filter(p=>p.id!==btn.dataset.delPayment);
        await savePayments();
        renderMalipo();
      });
    });
  }

  // init
  (async ()=>{
    bodyEl.innerHTML = `<div class="db-empty">Inapakia...</div>`;
    try{
      await loadAll();
    }catch(e){
      console.error('Imeshindwa kupakia data', e);
      if(headerEl) headerEl.style.display = '';
      tabsEl.innerHTML = '';
      bodyEl.innerHTML = `
        <div class="db-form" style="max-width:460px;margin:40px auto;text-align:center;border-color:var(--unpaid);">
          <div class="db-section-title" style="justify-content:center;color:var(--unpaid);">Imeshindwa Kupakia Data</div>
          <p style="font-size:13px;color:var(--ink-soft);">Kumetokea hitilafu kusoma taarifa kutoka kwenye database (huenda ni mtandao). Kwa usalama wa data yako, programu haitaendelea mpaka hili lifanikiwe — hii inazuia data isije ikaandikwa upya kimakosa juu ya taarifa zako halisi.</p>
          <button class="db-btn" id="retry-load">Jaribu Tena</button>
        </div>
      `;
      document.getElementById('retry-load').addEventListener('click', ()=>{ window.location.reload(); });
      return;
    }
    auth.onAuthStateChanged((user)=>{
      currentUser = user;
      if(user){
        currentProfile = userProfiles[user.uid] || null;
        routeAfterLogin();
      } else {
        currentProfile = null;
        viewMode = 'home';
        render();
      }
    });
  })();
})();
</script>
</body>
</html>
